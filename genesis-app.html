        if(h.kind === "changed"){
          lineText = esc(h.label) + ' changed from <strong>&ldquo;' + esc(h.oldValue || "(blank)") + '&rdquo;</strong> to <strong>&ldquo;' + esc(h.newValue || "(blank)") + '&rdquo;</strong>';
        } else {
          lineText = esc(h.label);
        }
        return '<div style="padding:10px 0;border-bottom:1px solid var(--border)">' +
          '<div style="font-size:11.5px;color:var(--slate);margin-bottom:3px">' + fmtHistoryTs(h.at) + (sectionBit ? ' &middot; ' + sectionBit : '') + '</div>' +
          '<div style="font-size:13px">' + lineText + '</div>' +
        '</div>';
      }).join("");

    return '<p class="panel-intro">A running log of changes made to this file &mdash; what changed, when, and from what to what. Newest first.</p>' +
      '<div class="card">' +
        '<div class="card-title">File History</div>' +
        rows +
      '</div>';
  }

  /* ---------------- Firm Analytics (2026-08-26) ----------------
     Cross-file rollup computed purely from data already captured elsewhere (o.createdAt,
     each order's own File History entries for Title/Escrow Status changes, and the live
     Requirement/Exception disposition values) -- no new persisted schema needed. Answers
     what Cam asked for: how long files spend in each stage, how curative items typically
     resolve, and which parts of a file get revised most. Framed honestly as operational
     analytics built on real timestamped activity -- not a formal ALTA Best Practices
     certification -- though it's the kind of evidence that's relevant to Pillars 4
     (Settlement Processes) and 5 (Title Opinions) if that's ever needed. */
  function msToDays(ms){ return ms / (1000*60*60*24); }
  function fmtDuration(ms){
    if(ms == null || isNaN(ms)) return "—";
    var days = msToDays(ms);
    if(days < 1){
      var hours = Math.max(1, Math.round(days*24));
      return hours + (hours === 1 ? " hour" : " hours");
    }
    var rounded = days < 10 ? Math.round(days*10)/10 : Math.round(days);
    return rounded + (rounded === 1 ? " day" : " days");
  }

  // Reconstructs how long each order spent in each value of a tracked status field, using
  // that field's own History entries (already carrying an old/new value + timestamp) plus
  // the order's createdAt as the start of its very first (default) status. One "period" per
  // {order, status} span; ongoing:true means the order is still in that status right now.
  function computeStatusPeriods(orders, historySection, historyLabel, initialStatus){
    var periods = [];
    var now = new Date();
    orders.forEach(function(o){
      if(!o.createdAt) return;
      var events = [{ at: o.createdAt, status: initialStatus }];
      (o.history || []).filter(function(h){
        return h.kind === "changed" && h.section === historySection && h.label === historyLabel;
      }).sort(function(a,b){ return new Date(a.at) - new Date(b.at); }).forEach(function(h){
        events.push({ at: h.at, status: h.newValue });
      });
      for(var i=0;i<events.length;i++){
        var start = new Date(events[i].at);
        var end = events[i+1] ? new Date(events[i+1].at) : now;
        periods.push({ fileNo: o.fileNo, status: events[i].status || "(unknown)", ms: end - start, ongoing: !events[i+1] });
      }
    });
    return periods;
  }

  function summarizeStatusPeriods(periods, statusOrder){
    var byStatus = {};
    periods.forEach(function(p){
      if(!byStatus[p.status]) byStatus[p.status] = { completed: [], ongoing: [] };
      (p.ongoing ? byStatus[p.status].ongoing : byStatus[p.status].completed).push(p);
    });
    var statuses = statusOrder.filter(function(s){ return byStatus[s]; });
    Object.keys(byStatus).forEach(function(s){ if(statuses.indexOf(s) === -1) statuses.push(s); });
    return statuses.map(function(s){
      var g = byStatus[s];
      var avgMs = g.completed.length ? g.completed.reduce(function(sum,p){ return sum+p.ms; }, 0) / g.completed.length : null;
      return { status: s, completedCount: g.completed.length, avgMs: avgMs, ongoing: g.ongoing.slice().sort(function(a,b){ return b.ms-a.ms; }) };
    });
  }

  // Curative outcomes are read directly off the live Requirement/Exception records (accurate,
  // no reconstruction needed); resolution TIME is estimated by matching each item's "added"
  // history event to its first disposition-change event with the same kind+description --
  // a text match, not an id, so it's a reasonable sample rather than a legal-grade audit trail.
  function computeCurativeStats(orders){
    var dispositionCounts = {};
    var resolutionSamples = [];
    orders.forEach(function(o){
      if(!o.commitment) return;
      var addedAt = {}, firstDispositionAt = {};
      (o.history || []).forEach(function(h){
        if(h.kind === "added"){
          var ma = /^(Requirement|Exception) added: (.+)$/.exec(h.label);
          if(ma){
            var ka = ma[1] + "::" + ma[2];
            if(!addedAt[ka] || new Date(h.at) < new Date(addedAt[ka])) addedAt[ka] = h.at;
          }
        } else if(h.kind === "changed" && h.section === "Curative" && h.newValue){
          var md = /^(Requirement|Exception) Disposition — (.+)$/.exec(h.label);
          if(md){
            var kd = md[1] + "::" + md[2];
            if(!firstDispositionAt[kd] || new Date(h.at) < new Date(firstDispositionAt[kd])) firstDispositionAt[kd] = h.at;
          }
        }
      });
      function tally(list, kind){
        (list || []).forEach(function(item){
          var disp = item.disposition || "(Not yet resolved)";
          dispositionCounts[disp] = (dispositionCounts[disp] || 0) + 1;
          var key = kind + "::" + item.description;
          if(item.disposition && addedAt[key] && firstDispositionAt[key]){
            resolutionSamples.push(new Date(firstDispositionAt[key]) - new Date(addedAt[key]));
          }
        });
      }
      tally(o.commitment.requirements, "Requirement");
      tally(o.commitment.exceptions, "Exception");
    });
    var avgResolutionMs = resolutionSamples.length ? resolutionSamples.reduce(function(a,b){ return a+b; }, 0) / resolutionSamples.length : null;
    return { dispositionCounts: dispositionCounts, avgResolutionMs: avgResolutionMs, resolvedCount: resolutionSamples.length };
  }

  // Which sections of a file actually get revised, firm-wide, plus a count of specific
  // "reopened after finalized" milestones -- a reasonable proxy for rework/instability.
  function computeChangeDrivers(orders){
    var bySection = {};
    var reopenCounts = { "Commitment Reverted to Draft": 0, "Clear to Close Rescinded": 0 };
    orders.forEach(function(o){
      (o.history || []).forEach(function(h){
        var sec = h.section || "(unspecified)";
        bySection[sec] = (bySection[sec] || 0) + 1;
        if(h.kind === "milestone" && reopenCounts.hasOwnProperty(h.label)) reopenCounts[h.label]++;
      });
    });
    var sections = Object.keys(bySection).map(function(s){ return { section: s, count: bySection[s] }; }).sort(function(a,b){ return b.count - a.count; });
    return { sections: sections, reopenCounts: reopenCounts };
  }

  function tplFirmAnalytics(){
    var orders = state.orders;
    if(orders.length === 0){
      return '<div class="no-order">' + MARK_SVG.replace('#4FAFA0','#3E5872').replace('#A9B9C8','#DFE5EA') +

      '</div>';
    }

    var titlePeriods = computeStatusPeriods(orders, "Order Information", "Title Status", "In Progress");
    var titleSummary = summarizeStatusPeriods(titlePeriods, TITLE_STATUSES.map(function(s){ return s.v; }));
    var curative = computeCurativeStats(orders);
    var drivers = computeChangeDrivers(orders);

    var cycleRows = titleSummary.map(function(s){

        '<div style="font-weight:600">' + esc(s.status) + '</div>' +

    var dispKeys = Object.keys(curative.dispositionCounts).sort(function(a,b){ return curative.dispositionCounts[b] - curative.dispositionCounts[a]; });
    var dispRows = dispKeys.map(function(d){

    }).join("");

    return '<p class="panel-intro">Cross-file trends drawn from every order\'s own File History &mdash; real, timestamped activity, not a manually maintained summary. Useful for spotting bottlenecks internally, and as an honest record of how consistently settlement and title work followed a documented process (relevant to ALTA Best Practices Pillars 4 &amp; 5, if that\'s ever needed) &mdash; though this is operational analytics, not a formal compliance certification.</p>' +
      '<div class="card">' +
        '<div class="card-title">Cycle Time by Title Status &middot; ' + orders.length + ' file' + (orders.length === 1 ? '' : 's') + '</div>' +
        '<div style="display:grid;grid-template-columns:1.4fr 1fr 1fr 1.8fr;gap:10px;padding-bottom:6px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--slate)">' +
          '<div>Status</div><div>Completed periods</div><div>Avg. duration</div><div>Currently in this status</div>' +
        '</div>' +
        cycleRows +
      '</div>' +
      '<div class="card" style="margin-top:16px">' +
        '<div class="card-title">Curative Patterns</div>' +
        '<p class="field-hint" style="margin-bottom:8px">Disposition outcomes across every Requirement and Exception on file' +
          (curative.resolvedCount ? '; average time from an item being added to its first disposition: <strong>' + fmtDuration(curative.avgResolutionMs) + '</strong> (' + curative.resolvedCount + ' resolved item' + (curative.resolvedCount === 1 ? '' : 's') + ' sampled).' : ', and how long they take to resolve once more files have curative history.') +
        '</p>' +
        (dispRows || '<div class="empty-card">No Requirements or Exceptions on file yet.</div>') +
      '</div>' +
      '<div class="card" style="margin-top:16px">' +
        '<div class="card-title">What&rsquo;s Driving Changes</div>' +
        '<p class="field-hint" style="margin-bottom:8px">File History entries by section, most active first &mdash; where staff time and revisions are actually going.</p>' +
        (driverRows || '<div class="empty-card">No history recorded yet.</div>') +
        (reopenBits ? '<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--hairline)"><div class="field-hint" style="margin-bottom:4px">Reopened-after-finalized events</div>' + reopenBits + '</div>' : '') +

  /* ---------------- Reusable line-item table (Escrow/Closing: CDF & HUD itemized sections) ----------------
     One generic pattern reused across every "list of {description + one or more dollar columns} with a
     computed total" section on CDF Pages 2/3 and HUD Pages 1/2 -- rather than hand-rolling ~15 near-identical
     CRUD lists. Each row is directly editable (no separate add/edit-toggle state); "Add" appends a new row. */
  function tplLineItemTable(items, cols, prefix){
    items = items || [];
    var colTemplate = "2fr " + cols.map(function(){ return "1fr"; }).join(" ") + " auto";
    var headerRow = items.length ? ('<div style="display:grid;grid-template-columns:' + colTemplate + ';gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--slate);padding-bottom:4px">' +
      '<div>Description</div>' + cols.map(function(c){ return '<div>' + esc(c.label) + '</div>'; }).join("") + '<div></div></div>') : "";
    var rows = items.map(function(it){
      return '<div style="display:grid;grid-template-columns:' + colTemplate + ';gap:8px;align-items:center;padding:4px 0">' +
        '<input type="text" id="' + prefix + '-desc-' + it.id + '" value="' + esc(it.description) + '" placeholder="Description">' +
        cols.map(function(c){ return '<input type="text" id="' + prefix + '-' + c.key + '-' + it.id + '" value="' + esc(it[c.key]) + '" placeholder="0.00">'; }).join("") +
        '<button class="icon-btn" data-li-del="' + prefix + ':' + it.id + '" title="Remove">' + trashIcon() + '</button>' +
      '</div>';
    }).join("");
    var totalRow = items.length ? ('<div style="display:grid;grid-template-columns:' + colTemplate + ';gap:8px;padding:6px 0;border-top:1px solid var(--hairline);margin-top:2px">' +
      '<div style="font-weight:600;font-size:12.5px">Total</div>' +
      cols.map(function(c){
        var sum = items.reduce(function(s, it){ var n = parseFloat(it[c.key]); return s + (isNaN(n) ? 0 : n); }, 0);
        return '<div style="font-weight:600;font-size:12.5px">' + fmtMoney(sum) + '</div>';
      }).join("") + '<div></div></div>') : "";
    var emptyState = items.length ? "" : '<div class="empty-card">No line items yet.</div>';
    var addRow = '<div style="display:grid;grid-template-columns:' + colTemplate + ';gap:8px;align-items:center;margin-top:8px">' +
      '<input type="text" id="' + prefix + '-new-desc" placeholder="Add a line item">' +
      cols.map(function(c){ return '<input type="text" id="' + prefix + '-new-' + c.key + '" placeholder="0.00">'; }).join("") +
      '<button class="btn btn-secondary" data-li-add="' + prefix + '">Add</button>' +
    '</div>';
    return headerRow + rows + totalRow + emptyState + addRow;
  }
  function wireLineItemTable(items, prefix, cols){
    items.forEach(function(it){
      var descEl = document.getElementById(prefix + "-desc-" + it.id);
      if(descEl) descEl.addEventListener("change", function(){ it.description = descEl.value; save(); renderTabPanel(); });
      cols.forEach(function(c){
        var el = document.getElementById(prefix + "-" + c.key + "-" + it.id);
        if(!el) return;
        el.addEventListener("change", function(){ it[c.key] = el.value; save(); renderTabPanel(); });
      });
    });
    var addBtn = document.querySelector('[data-li-add="' + prefix + '"]');
    if(addBtn) addBtn.addEventListener("click", function(){
      var descEl = document.getElementById(prefix + "-new-desc");
      var desc = descEl ? descEl.value.trim() : "";
      var newItem = { id: uid(), description: desc };
      var anyVal = false;
      cols.forEach(function(c){
        var el = document.getElementById(prefix + "-new-" + c.key);
        var v = el ? el.value : "";
        if(v) anyVal = true;
        newItem[c.key] = v;
      });
      if(!desc && !anyVal) return;
      items.push(newItem);
      save(); renderTabPanel();
    });
    document.querySelectorAll('[data-li-del^="' + prefix + ':"]').forEach(function(el){
      el.addEventListener("click", function(){
        var val = el.getAttribute("data-li-del");
        var id = val.slice(prefix.length + 1);
        for(var i=0;i<items.length;i++){ if(items[i].id === id){ items.splice(i,1); break; } }
        save(); renderTabPanel();
      });
    });
  }
  function lineItemTotal(items, key){
    return (items||[]).reduce(function(s, it){ var n = parseFloat(it[key]); return s + (isNaN(n) ? 0 : n); }, 0);

  /* ---------------- CD-recreation chrome helpers (Escrow/Closing CDF screens only) ----------------

  function cdProrationRows(o, side){

      return '<div class="cdform-row" style="grid-template-columns:26px 1fr auto"><div class="cdform-num"></div><div class="cdform-label">' + esc(it.label) + range + '</div><div class="cdform-amt">' + cdCalcStatic(amt) + '</div></div>';

  // Renders a CD-style itemized line-item table: numbered rows, an optional 2-level grouped header

  function tplCdfLineItemTable(items, cols, prefix, subtotalLabel, startNum){

      });

    var headerRow = '<div class="cdform-row header" style="display:grid;grid-template-columns:' + colTemplate + '">' + headerCells.join("") + '</div>';

      return '<div class="cdform-row" style="display:grid;grid-template-columns:' + colTemplate + '">' +

        cols.map(function(c){ return '<div class="cdform-amt"><input type="text" id="' + prefix + '-' + c.key + '-' + it.id + '" value="' + esc(it[c.key]) + '" placeholder="0.00"></div>'; }).join("") +

    cols.forEach(function(c){ addCells.push('<div><input type="text" id="' + prefix + '-new-' + c.key + '" placeholder="0.00"></div>'); });

  /* ---------------- Proration split calculator (Escrow/Closing: Tax & Other Prorations) ----------------
     Standard 365-day, per-diem method. Convention used here: Seller is responsible for the proration
     period through the day BEFORE the proration date; Buyer is credited/charged from the proration date
     forward (i.e. Buyer owns the day of closing). This is a common convention but not universal -- some
     states/local customs credit the day of closing to the Seller instead. Flagged to Cam; not configurable
     yet. */
  function computeProrationSplit(annualAmount, periodStart, periodEnd, prorationDate){
    var amt = parseFloat(annualAmount);
    if(isNaN(amt) || !periodStart || !periodEnd || !prorationDate) return null;
    var start = new Date(periodStart + "T00:00:00");
    var end = new Date(periodEnd + "T00:00:00");
    var settle = new Date(prorationDate + "T00:00:00");
    if(isNaN(start.getTime()) || isNaN(end.getTime()) || isNaN(settle.getTime())) return null;
    var totalDays = Math.round((end - start) / 86400000) + 1;
    if(totalDays <= 0) return null;
    var sellerDays = Math.round((settle - start) / 86400000);
    if(sellerDays < 0) sellerDays = 0;
    if(sellerDays > totalDays) sellerDays = totalDays;
    var buyerDays = totalDays - sellerDays;
    var dailyRate = amt / totalDays;
    return {
      totalDays: totalDays, sellerDays: sellerDays, buyerDays: buyerDays,
      sellerAmount: dailyRate * sellerDays, buyerAmount: dailyRate * buyerDays
    };
  }
  function tplProrationRow(items, prefix, typeOptions){
    var rows = (items||[]).length === 0 ? '<div class="empty-card">None added yet.</div>' :
      items.map(function(p){
        var split = computeProrationSplit(p.annualAmount, p.periodStart, p.periodEnd, p.prorationDate);
        var splitText = split ? (split.sellerDays + " days Seller / " + split.buyerDays + " days Buyer &mdash; Seller " + esc(fmtMoney(split.sellerAmount)) + ", Buyer " + esc(fmtMoney(split.buyerAmount))) : "Fill in period + proration date to calculate the split";
        var typeField = typeOptions ?
          '<select id="' + prefix + '-type-' + p.id + '">' + typeOptions.map(function(t){ return '<option value="' + t + '"' + (t===p.type?" selected":"") + '>' + t + '</option>'; }).join("") + '</select>' :
          '<input type="text" id="' + prefix + '-desc-' + p.id + '" value="' + esc(p.description) + '" placeholder="Description">';
        return '<div class="card" style="background:var(--paper)">' +
          '<div class="field-grid cols-4">' +
            '<div class="field"><label>' + (typeOptions ? "Type" : "Description") + '</label>' + typeField + '</div>' +
            '<div class="field"><label>Annual Amount</label><input type="text" id="' + prefix + '-amt-' + p.id + '" value="' + esc(p.annualAmount) + '" placeholder="0.00"></div>' +
            '<div class="field"><label>Period Start</label><input type="date" id="' + prefix + '-start-' + p.id + '" value="' + esc(p.periodStart) + '"></div>' +
            '<div class="field"><label>Period End</label><input type="date" id="' + prefix + '-end-' + p.id + '" value="' + esc(p.periodEnd) + '"></div>' +
            '<div class="field"><label>Proration Date</label><input type="date" id="' + prefix + '-prdate-' + p.id + '" value="' + esc(p.prorationDate) + '"></div>' +
          '</div>' +
          '<p class="field-hint" style="margin-top:8px;margin-bottom:0">' + splitText + '</p>' +
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px">' +
            '<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--slate)"><input type="checkbox" id="' + prefix + '-advance-' + p.id + '"' + (p.paidInAdvance?' checked':'') + '> Paid in advance by Seller (unchecked = unpaid/arrears, the more common case)</label>' +
            '<button class="icon-btn" data-del-proration="' + prefix + ':' + p.id + '" title="Remove">' + trashIcon() + '</button>' +
          '</div>' +
        '</div>';
      }).join("");
    return rows;
  }
  function wireProrationRows(items, prefix, hasType){
    items.forEach(function(p){
      function bindDate(field, id){
        var el = document.getElementById(id);
        if(el) el.addEventListener("change", function(){ p[field] = el.value; save(); renderTabPanel(); });
      }
      bindDate("annualAmount", prefix + "-amt-" + p.id);
      bindDate("periodStart", prefix + "-start-" + p.id);
      bindDate("periodEnd", prefix + "-end-" + p.id);
      bindDate("prorationDate", prefix + "-prdate-" + p.id);
      var advanceEl = document.getElementById(prefix + "-advance-" + p.id);
      if(advanceEl) advanceEl.addEventListener("change", function(){ p.paidInAdvance = advanceEl.checked; save(); renderTabPanel(); });
      if(hasType){
        var typeEl = document.getElementById(prefix + "-type-" + p.id);
        if(typeEl) typeEl.addEventListener("change", function(){ p.type = typeEl.value; save(); renderTabPanel(); });
      } else {
        var descEl = document.getElementById(prefix + "-desc-" + p.id);
        if(descEl) descEl.addEventListener("change", function(){ p.description = descEl.value; save(); renderTabPanel(); });
      }
    });
    document.querySelectorAll('[data-del-proration^="' + prefix + ':"]').forEach(function(el){
      el.addEventListener("click", function(){
        var val = el.getAttribute("data-del-proration");
        var id = val.slice(prefix.length + 1);
        for(var i=0;i<items.length;i++){ if(items[i].id === id){ items.splice(i,1); break; } }
        save(); renderTabPanel();
      });
    });
  }

    var cdf2P2 = o.escrow.cdf.page2;
    var cdf2PointsEl = document.getElementById("cdf2-sectionA-pointsPercent");
    if(cdf2PointsEl) cdf2PointsEl.addEventListener("change", function(){ cdf2P2.sectionAFixed.pointsPercent = cdf2PointsEl.value; save(); renderTabPanel(); });
    var cdf2PerDiemRateEl = document.getElementById("cdf2-sectionF-perDiemRate");
    if(cdf2PerDiemRateEl) cdf2PerDiemRateEl.addEventListener("change", function(){ cdf2P2.sectionFFixed.perDiemRate = cdf2PerDiemRateEl.value; save(); renderTabPanel(); });
    var cdf2PerDiemDaysEl = document.getElementById("cdf2-sectionF-perDiemDays");
    if(cdf2PerDiemDaysEl) cdf2PerDiemDaysEl.addEventListener("change", function(){ cdf2P2.sectionFFixed.perDiemDays = cdf2PerDiemDaysEl.value; save(); renderTabPanel(); });
    var btnRefillCdf2PerDiem = document.getElementById("btn-refill-cdf2-perdiem");
    if(btnRefillCdf2PerDiem) btnRefillCdf2PerDiem.addEventListener("click", function(){
      var p1 = o.escrow.cdf.page1;
      var loanAmt = cdfLoanAmount(o), rate = parseFloat(p1.interestRate) || 0;
      cdf2P2.sectionFFixed.perDiemRate = (loanAmt * (rate / 100) / 360) || "";
      logHistoryEvent(o, "Escrow / Closing", "milestone", "CDF Page 2 Prepaid Interest per diem refilled from Loan Amount x Rate / 360");
      save(); renderTabPanel();
    });
    var cdf2AggAdjEl = document.getElementById("cdf2-sectionG-aggregateAdjustment");
    if(cdf2AggAdjEl) cdf2AggAdjEl.addEventListener("change", function(){ cdf2P2.sectionGFixed.aggregateAdjustment = cdf2AggAdjEl.value; save(); renderTabPanel(); });
    var cdf2LenderCreditsEl = document.getElementById("cdf2-lenderCredits");
    if(cdf2LenderCreditsEl) cdf2LenderCreditsEl.addEventListener("change", function(){ cdf2P2.lenderCredits = cdf2LenderCreditsEl.value; save(); renderTabPanel(); });
    // CDF Page 3 -- K/L/M/N (purchase) or Payoffs and Payments (refi), plus Calculating Cash to Close
    if(cdfIsRefi(o)){
      wireLineItemTable(o.escrow.cdf.page3.payoffsAndPayments, "cdf3payoffs", CDF_PAGE3_COLS);
    } else {
      wireLineItemTable(o.escrow.cdf.page3.dueFromBorrower, "cdf3k", CDF_PAGE3_COLS);
      wireLineItemTable(o.escrow.cdf.page3.paidByOrForBorrower, "cdf3l", CDF_PAGE3_COLS);
      wireLineItemTable(o.escrow.cdf.page3.dueToSeller, "cdf3m", CDF_PAGE3_COLS);
      wireLineItemTable(o.escrow.cdf.page3.dueFromSeller, "cdf3n", CDF_PAGE3_COLS);
      // K/L/M/N's fixed lines (Deposit, Seller Credit, mortgage payoffs) live-refresh on change,
      // like the free-text line items above, so the K/L/M/N/Cash-to-Close totals right below stay
      // in sync immediately instead of waiting for the next full re-render (unlike plain bindText).
      ["deposit","sellerCredit","firstMortgagePayoff","secondMortgagePayoff"].forEach(function(fld){
        var el = document.getElementById("cdf3fixed-" + fld);
        if(el) el.addEventListener("change", function(){ o.escrow.cdf.page3.fixed[fld] = el.value; save(); renderTabPanel(); });
      });
    }
    ["totalClosingCostsLE","closingCostsPaidBeforeClosingLE","closingCostsFinancedLE","closingCostsFinancedFinal",
     "downPaymentLE","downPaymentFinal","depositLE","depositFinal","fundsForBorrowerLE","fundsForBorrowerFinal",
     "sellerCreditsLE","sellerCreditsFinal","adjustmentsOtherLE","adjustmentsOtherFinal","cashToCloseLE","loanAmountLE","payoffsLE"].forEach(function(f){
      bindText("cdf3calc-" + f, function(v){ o.escrow.cdf.page3.calc[f] = v; });
    });

    // CDF Page 4
    bindText("cdf4-notes", function(v){ o.escrow.cdf.page4.notes = v; });

    // CDF Page 5
    bindText("cdf5-totalOfPayments", function(v){ o.escrow.cdf.page5.totalOfPayments = v; });
    bindText("cdf5-financeCharge", function(v){ o.escrow.cdf.page5.financeCharge = v; });
    bindText("cdf5-amountFinanced", function(v){ o.escrow.cdf.page5.amountFinanced = v; });
    bindText("cdf5-apr", function(v){ o.escrow.cdf.page5.apr = v; });
    bindText("cdf5-totalInterestPercentage", function(v){ o.escrow.cdf.page5.totalInterestPercentage = v; });
    bindText("cdf5-appraisal", function(v){ o.escrow.cdf.page5.appraisal = v; });
    bindText("cdf5-contractDetails", function(v){ o.escrow.cdf.page5.contractDetails = v; });
    bindText("cdf5-liabilityAfterForeclosure", function(v){ o.escrow.cdf.page5.liabilityAfterForeclosure = v; });
    bindText("cdf5-refinance", function(v){ o.escrow.cdf.page5.refinance = v; });
    bindText("cdf5-taxDeductions", function(v){ o.escrow.cdf.page5.taxDeductions = v; });
    ["lender","mortgageBroker","realEstateBrokerBuyer","realEstateBrokerSeller","settlementAgent"].forEach(function(key){
      ["name","license","contact","address","email","phone"].forEach(function(f){
        bindText("cdf5-" + key + "-" + f, function(v){ o.escrow.cdf.page5.contacts[key][f] = v; });
      });
    });
    var btnRefillCdf5Contacts = document.getElementById("btn-refill-cdf5-contacts");
    if(btnRefillCdf5Contacts) btnRefillCdf5Contacts.addEventListener("click", function(){
      var p5c = o.escrow.cdf.page5.contacts;
      var lender = o.contacts.filter(function(c){ return c.role === "Lender"; })[0];
      if(lender){ p5c.lender.name = lender.name || ""; p5c.lender.address = lender.address || ""; p5c.lender.email = lender.email || ""; p5c.lender.phone = lender.phone || ""; }
      var sa = o.contacts.filter(function(c){ return c.role === "Settlement Agent"; })[0];
      if(sa){ p5c.settlementAgent.name = sa.name || ""; p5c.settlementAgent.address = sa.address || ""; p5c.settlementAgent.email = sa.email || ""; p5c.settlementAgent.phone = sa.phone || ""; p5c.settlementAgent.license = sa.licenseNumber || ""; }
      logHistoryEvent(o, "Escrow / Closing", "milestone", "CDF Page 5 Lender / Settlement Agent contacts refilled from Contacts");
      save(); renderTabPanel();
    });

    // Express HUD Page 1
    bindText("hud1-typeOfLoan", function(v){ o.escrow.hud.page1.typeOfLoan = v; });
    bindText("hud1-loanNumber", function(v){ o.escrow.hud.page1.loanNumber = v; });
    bindText("hud1-micNumber", function(v){ o.escrow.hud.page1.micNumber = v; });
    bindText("hud1-placeOfSettlement", function(v){ o.escrow.hud.page1.placeOfSettlement = v; });
    wireLineItemTable(o.escrow.hud.page1.grossDueFromBorrower, "hud1gfb", HUD_PAGE1_COLS);
    wireLineItemTable(o.escrow.hud.page1.amountsPaidByForBorrower, "hud1pfb", HUD_PAGE1_COLS);
    wireLineItemTable(o.escrow.hud.page1.grossDueToSeller, "hud1gts", HUD_PAGE1_COLS);
    wireLineItemTable(o.escrow.hud.page1.reductionsDueToSeller, "hud1rds", HUD_PAGE1_COLS);

    // Express HUD Page 2
    ["section700","section800","section900","section1000","section1100","section1200","section1300"].forEach(function(k){
      wireLineItemTable(o.escrow.hud.page2[k], "hud2" + k, HUD_PAGE2_COLS);
    });
    // Express HUD Page 3
    bindText("hud3-initialLoanAmount", function(v){ o.escrow.hud.page3.initialLoanAmount = v; });
    bindText("hud3-loanTerm", function(v){ o.escrow.hud.page3.loanTerm = v; });
    bindText("hud3-initialInterestRate", function(v){ o.escrow.hud.page3.initialInterestRate = v; });
    bindText("hud3-initialMonthlyAmount", function(v){ o.escrow.hud.page3.initialMonthlyAmount = v; });
    bindText("hud3-doesRateAdjust", function(v){ o.escrow.hud.page3.doesRateAdjust = v; });
    bindText("hud3-hasPrepaymentPenalty", function(v){ o.escrow.hud.page3.hasPrepaymentPenalty = v; });
    bindText("hud3-hasBalloonPayment", function(v){ o.escrow.hud.page3.hasBalloonPayment = v; });
    ["gfeCannotIncrease","gfeTenPercentCap","gfeCanChange"].forEach(function(key){
      bindText("hud3-" + key + "-gfeAmount", function(v){ o.escrow.hud.page3[key].gfeAmount = v; });
      bindText("hud3-" + key + "-hud1Amount", function(v){ o.escrow.hud.page3[key].hud1Amount = v; });
    });

    function bindText(id, setter){
      var el = document.getElementById(id);
      if(!el) return;
      var section = ALL_TAB_LABELS[state.currentTab] || state.currentTab;
      var fieldEl = el.closest ? el.closest(".field") : null;
      var labelEl = fieldEl ? fieldEl.querySelector("label") : null;
      var fieldLabel = labelEl ? labelEl.textContent : id;
      var beforeVal = el.value;
      el.addEventListener("input", function(){ setter(el.value); save(); });
      el.addEventListener("change", function(){
        setter(el.value);
        logHistory(o, section, fieldLabel, beforeVal, el.value);
        beforeVal = el.value;
        save();
      });
    }
  }

  load();
  render();
})();
</script>
