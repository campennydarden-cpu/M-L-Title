          ci.recordedDate ? "Recorded " + fmtDate(ci.recordedDate) : "",
          (ci.book || ci.page) ? ("Bk " + esc(ci.book) + " Pg " + esc(ci.page)) : "",
          ci.instrumentNumber ? "Instr# " + esc(ci.instrumentNumber) : ""
        ].filter(Boolean).join(" &middot; ");
        return recordRow(title, bits, "data-del-cot", ci.id, "data-edit-cot", ci.id);
      }).join("");

    var d = o.prelim.derivation;
    var cotSeed = (d.name || d.grantorName) ?
      '<button class="seed-chip" data-seed-cot-derivation="1" title="Pre-fill from the current vesting Derivation record">+ Copy from Derivation (' + esc(d.grantorName || "?") + ' &rarr; ' + esc(d.name || "?") + ')</button>' : '';

    // Simultaneous issuance = an Owner's Policy AND a Loan Policy, each confirmed separately; Owner's/Loan mean only that one.
    // Short Form is a single-policy, Loan-Policy-only form per the ALTA Short Form Commitment -- no Owner's Policy slot.
    var isShortForm = c.formType === "Short Form";
    var showOwnerPolicy = !isShortForm && (o.policyType === "Owner's" || o.policyType === "Simultaneous");
    var showLoanPolicy = isShortForm || o.policyType === "Loan" || o.policyType === "Simultaneous";

    var buyerBorrowerContacts = o.contacts.filter(function(ct){ return ct.role === "Buyer/Borrower"; });
    var ownerInsuredChips = buyerBorrowerContacts.map(function(ct){
      return '<button class="seed-chip" data-seed-owner-insured="' + ct.id + '">+ ' + esc(ct.name) + '</button>';
    }).join("");
    var ownerInsuredAllClause = buyerBorrowerContacts.length > 1 ? groupVestingClause(buyerBorrowerContacts, "") : "";
    var ownerInsuredAllChip = ownerInsuredAllClause ?
      '<button class="seed-chip" data-seed-owner-insured-all="1">+ All Buyer/Borrowers (' + esc(ownerInsuredAllClause) + ')</button>' : '';
    var lenderContacts = o.contacts.filter(function(ct){ return ct.role === "Lender"; });
    var loanInsuredChips = lenderContacts.map(function(ct){
      return '<button class="seed-chip" data-seed-loan-insured="' + ct.id + '">+ ' + esc(ct.name) + '</button>';
    }).join("");
    var mortgageeClauseChips = lenderContacts.map(function(ct){
      var mcClause = mortgageeClauseFromContact(ct);
      return '<button class="seed-chip" data-seed-mortgagee-clause="' + ct.id + '" title="' + esc(mcClause) + '">+ Copy from ' + esc(ct.name) + '</button>';
    }).join("");

    var ownerPolicyCard = !showOwnerPolicy ? '' : '<div class="card">' +
        '<div class="card-title">Owner\'s Policy</div>' +
        '<div class="field-grid cols-3" style="margin-top:16px">' +
          field("ALTA Form", selectField("sa-ownerPolicyType", POLICY_TYPES, sa.ownerPolicy.policyType)) +
          field("Coverage Amount", '<input type="text" id="sa-ownerCoverageAmount" value="' + esc(sa.ownerPolicy.coverageAmount) + '" placeholder="0.00">') +
        '</div>' +
        '<div class="field-grid" style="margin-top:4px">' +
          field("Proposed Insured", '<input type="text" id="sa-ownerProposedInsured" value="' + esc(sa.ownerPolicy.proposedInsured) + '">') +
        '</div>' +
        (ownerInsuredChips ? '<p class="field-hint" style="margin-top:0">From this file</p><div class="seed-picker">' + ownerInsuredAllChip + ownerInsuredChips + '</div>' : '') +
      '</div>';
    var loanPolicyCard = !showLoanPolicy ? '' : '<div class="card">' +
        '<div class="card-title">Loan Policy</div>' +
        '<div class="field-grid cols-3" style="margin-top:16px">' +
          field("ALTA Form", selectField("sa-loanPolicyType", POLICY_TYPES, sa.loanPolicy.policyType)) +
          field("Coverage Amount", '<input type="text" id="sa-loanCoverageAmount" value="' + esc(sa.loanPolicy.coverageAmount) + '" placeholder="0.00">') +
        '</div>' +
        '<div class="field-grid" style="margin-top:4px">' +
          field("Proposed Insured", '<input type="text" id="sa-loanProposedInsured" value="' + esc(sa.loanPolicy.proposedInsured) + '">') +
        '</div>' +
        (loanInsuredChips ? '<p class="field-hint" style="margin-top:0">From this file</p><div class="seed-picker">' + loanInsuredChips + '</div>' : '') +
        '<div class="field-grid" style="margin-top:4px">' +
          field("Mortgagee Clause", '<textarea id="sa-loanMortgageeClause" placeholder="ISAOA/ATIMA clause language">' + esc(sa.loanPolicy.mortgageeClause) + '</textarea>') +
        '</div>' +
        (mortgageeClauseChips ? '<p class="field-hint" style="margin-top:0">From Lender contact on file</p><div class="seed-picker">' + mortgageeClauseChips + '</div>' : '') +
      '</div>';

    var estateField = isShortForm
      ? docFact("The estate or interest in the Land", "Fee Simple (fixed by the ALTA Short Form Commitment)")
      : field("The estate or interest in the Land", '<input type="text" id="sa-titleHeldAs" value="' + esc(sa.titleHeldAs) + '" placeholder="e.g. Fee Simple, Leasehold">');

    var transactionIdCard = '<div class="card">' +
        '<div class="card-title">Transaction Identification Data <span class="field-hint" style="display:inline;text-transform:none;letter-spacing:normal;font-weight:400">(optional &mdash; for reference only, per the ALTA form)</span></div>' +
        '<div class="field-grid cols-3" style="margin-top:16px">' +
          field("Issuing Agent", '<input type="text" id="c-issuingAgent" value="' + esc(c.issuingAgent) + '">') +
          field("Issuing Office", '<input type="text" id="c-issuingOffice" value="' + esc(c.issuingOffice) + '">') +
          field("ALTA Universal ID", '<input type="text" id="c-altaUniversalId" value="' + esc(c.altaUniversalId) + '">') +
          field("Loan ID Number", '<input type="text" id="c-loanIdNumber" value="' + esc(c.loanIdNumber) + '">') +
          field("Commitment Number", '<input type="text" id="c-commitmentNumber" value="' + esc(c.commitmentNumber) + '">') +
          field("Revision Number", '<input type="text" id="c-revisionNumber" value="' + esc(c.revisionNumber) + '">') +
        '</div>' +
      '</div>';

    var commitmentDetailsCard = '<div class="card">' +
        '<div class="card-title">Commitment Form</div>' +
        '<div class="field-grid cols-3" style="margin-top:16px">' +
          field("Form Type", selectField("c-formType", COMMITMENT_FORM_TYPES, c.formType)) +
          field("Company’s State of Organization", '<input type="text" id="c-companyStateOfOrg" value="' + esc(c.companyStateOfOrg) + '" placeholder="e.g. Ohio corporation">') +
          field("Requirements Time Period", '<input type="text" id="c-requirementsTimePeriod" value="' + esc(c.requirementsTimePeriod) + '" placeholder="e.g. 6 months">') +
        '</div>' +
        (isShortForm ? '<div class="field-grid" style="margin-top:4px">' +
          field("ALTA 8.1-06 (Environmental Protection Lien) endorsement statutes", '<textarea id="sa-envProtectionLienStatutes" placeholder="State statutes to be set forth on any ALTA 8.1-06 endorsement">' + esc(sa.envProtectionLienStatutes) + '</textarea>') +
        '</div>' : '') +
        (isShortForm && o.policyType && o.policyType !== "Loan" ? '<p class="field-hint" style="margin-top:8px">Short Form issues a Loan Policy only — Order Entry’s Policy Type (' + esc(o.policyType) + ') won’t change that for this Commitment.</p>' : '') +
        '<p class="field-hint" style="margin-top:8px;margin-bottom:0">These two blanks fill the Commitment to Issue Policy paragraph and the Requirements deadline on the generated document. Form Type also selects which fixed ALTA jacket text (Notice, Commitment Conditions, standard Schedule B items) renders on the generated document — see the Commitment tab.</p>' +
      '</div>';

    return '<p class="panel-intro">Schedule A of the Commitment &mdash; policy and coverage detail, the chain of title, and the countersignature block. Effective Date, Property Address, Legal Description, and Vesting are pulled from Prelim Search / Property and shown on the generated document; everything here is entered directly.</p>' +
      commitmentDetailsCard + transactionIdCard +

          docFact("Policy Type (Order Entry)", o.policyType || "None") +
          estateField +
        '</div>' +
        (showOwnerPolicy || showLoanPolicy ? '' : '<p class="field-hint">Set a Policy Type (Owner\'s, Loan, or Simultaneous) on Order Entry to show the policy block(s) below.</p>') +

      ownerPolicyCard + loanPolicyCard +

        cotRows +
        '<div class="add-form" style="grid-template-columns:1fr 1fr 1fr">' +
          '<div class="field"><label>Instrument Type</label><input type="text" id="cot-instrumentType" placeholder="e.g. Warranty Deed"></div>' +

          '<div class="field"><label>Dated Date</label><input type="date" id="cot-datedDate"></div>' +

          '<div class="field"><label>Book</label><input type="text" id="cot-book"></div>' +

  function tplCommitment(o){
    var c = o.commitment;
    var biItems = standardBiItems(c.formType);
    var biOffset = biItems.length;
    var biStandardRows = biItems.map(function(t, idx){
      return '<div class="doc-item" style="padding-left:20px;position:relative"><span style="position:absolute;left:0;color:var(--slate)">' + (idx+1) + '.</span>' + esc(t) + '</div>';
    }).join("");
    var gapOffset = c.includeGapException ? 1 : 0;

    var reqLabels = computeReqLabels(c.requirements, biOffset);
    var reqRows = c.requirements.length === 0 ? '<div class="empty-card">No file-specific requirements added.</div>' :
      c.requirements.map(function(r, idx){
        if(state.editReqId === r.id) return tplEditReqForm(r);
        var indent = r.parentReqId ? 'margin-left:20px' : '';
        return '<div style="' + indent + '">' + recordRow(reqLabels[idx] + '. ' + esc(r.description), r.notes ? esc(r.notes) : '', c.final ? null : "data-del-req", r.id, "data-edit-req", r.id) + '</div>';
      }).join("");

    var excRows = c.exceptions.length === 0 ? '<div class="empty-card">No file-specific exceptions added.</div>' :
      c.exceptions.map(function(e, idx){
        if(state.editExcId === e.id) return tplEditExcForm(e);
        return recordRow((idx+1+gapOffset) + '. ' + esc(e.description), e.notes ? esc(e.notes) : '', c.final ? null : "data-del-exc", e.id, "data-edit-exc", e.id);
      }).join("");

    var reqSeeds = REQUIREMENT_SEEDS.map(function(s){ return '<button class="seed-chip" data-seed-req="' + esc(s) + '">+ ' + esc(s) + '</button>'; }).join("");
    var excSeeds = EXCEPTION_SEEDS.map(function(s){ return '<button class="seed-chip" data-seed-exc="' + esc(s) + '">+ ' + esc(s) + '</button>'; }).join("");

    var usedReqSources = c.requirements.filter(function(r){ return r.sourceType; }).map(function(r){ return r.sourceType + ":" + r.sourceId; });
    var siFileChips = o.prelim.securityInstruments.filter(function(m){ return usedReqSources.indexOf("si:" + m.id) === -1; }).map(function(m){
      var label = (m.instrumentType || "Security Instrument") + ": " + (m.mortgagor||"?") + " &rarr; " + (m.mortgagee||"?");
      return '<button class="seed-chip" data-seed-req-si="' + m.id + '" title="' + esc(siRequirementText(m)) + '">+ ' + esc(label) + '</button>';
    }).join("");
    var relFileChips = "";
    o.prelim.securityInstruments.forEach(function(si){
      // Related-document sub-item chips only appear once the parent SI's own requirement is on the
      // Commitment (5, 5a, 5b numbering needs a parent "5" to attach to).
      var parentReq = c.requirements.filter(function(r){ return r.sourceType === "si" && r.sourceId === si.id; })[0];
      if(!parentReq) return;
      (si.related || []).forEach(function(r){
        if(usedReqSources.indexOf("rel:" + r.id) !== -1) return;
        var relLabel = (r.type || "Related Document") + (r.assignor || r.assignee ? ": " + (r.assignor||"?") + " &rarr; " + (r.assignee||"?") : "");
        relFileChips += '<button class="seed-chip" data-seed-req-rel="' + r.id + '" data-seed-req-rel-si="' + si.id + '" title="' + esc(relRequirementText(r, si)) + '">+ ' + esc(relLabel) + ' (sub-item)</button>';
      });
    });
    var lienFileChips = o.prelim.liens.filter(function(l){
      return usedReqSources.indexOf("lien:" + l.id) === -1 && LIEN_NO_REQUIREMENT_CHIP_TYPES.indexOf(l.lienType) === -1;
    }).map(function(l){
      return '<button class="seed-chip" data-seed-req-lien="' + l.id + '" title="' + esc(lienRequirementText(l)) + '">+ ' + lienTitle(l) + '</button>';
    }).join("");
    var reqFileChips = siFileChips + relFileChips + lienFileChips;

    var usedExcSources = c.exceptions.filter(function(e){ return e.sourceType; }).map(function(e){ return e.sourceType + ":" + e.sourceId; });
    var emFileChips = o.prelim.exceptionMatters.filter(function(e){ return usedExcSources.indexOf("em:" + e.id) === -1; }).map(function(e){
      return '<button class="seed-chip" data-seed-exc-em="' + e.id + '" title="' + esc(emExceptionText(e)) + '">+ ' + esc(e.description || "(no description)") + '</button>';
    }).join("");

    var canGenerate = o.propertyAddress && o.property.legalDescription && o.prelim.effectiveDate;
    var doc = c.generated ? renderDoc(o) : "";

    var finalizeBlock = "";
    if(c.generated){
      if(c.final && state.confirmingUnfinalize){
        finalizeBlock = '<div class="card" style="border-color:var(--amber)">' +
          '<div class="card-title" style="color:var(--amber)">Revert this Commitment to Draft?</div>' +
          '<p class="field-hint" style="margin-top:6px">Unlocks Requirements and Exceptions for outright deletion again (not just Curative disposition). Any Curative dispositions already entered are kept. Title Status reverts to Exam.</p>' +
          '<button class="btn btn-primary" id="btn-confirm-unfinalize">Yes, Revert to Draft</button> <button class="btn btn-ghost" id="btn-cancel-unfinalize">Cancel</button>' +
        '</div>';
      } else if(c.final){
        finalizeBlock = '<p class="field-hint" style="margin-top:0">Status: <strong>Final</strong>' + (c.finalizedAt ? ' &middot; finalized ' + esc(fmtDate((c.finalizedAt||"").slice(0,10))) : '') + ' &mdash; Requirements/Exceptions are removed only via Curative disposition, not deleted outright.' +
          (c.ctcIssued
            ? ' &mdash; Rescind the Clear to Close on Curative before reverting to Draft.'
            : ' <button class="btn btn-ghost" id="btn-unfinalize-commitment" style="margin-left:6px;color:var(--red)">Revert to Draft</button>') +
          '</p>';
      } else if(state.confirmingFinalize){
        finalizeBlock = '<div class="card" style="border-color:var(--amber)">' +
          '<div class="card-title" style="color:var(--amber)">Finalize this Commitment?</div>' +
          '<p class="field-hint" style="margin-top:6px">Locks Draft &mdash; Requirements and Exceptions can no longer be deleted outright; removals go through Curative disposition instead. Can be reverted later from the Commitment tab.</p>' +
          '<button class="btn btn-primary" id="btn-confirm-finalize">Yes, Finalize</button> <button class="btn btn-ghost" id="btn-cancel-finalize">Cancel</button>' +
        '</div>';
      } else {
        finalizeBlock = '<p class="field-hint" style="margin-top:0">Status: <strong>Draft</strong> &middot; <button class="btn btn-secondary" id="btn-finalize-commitment" style="margin-left:6px">Finalize Commitment</button></p>';
      }
    }

    return '<p class="panel-intro">Schedule A pulls from Property, Prelim Search, and the Schedule A screen (policy type, coverage, chain of title, signature). Requirements and Exceptions build Schedule B.</p>' +
      finalizeBlock +
      '<div class="card">' +
        '<div class="card-title">Schedule A &middot; pulled from the file <a href="#" id="btn-goto-scheduleA" style="font-weight:400;font-size:12px;color:var(--teal-deep);margin-left:8px">Edit full Schedule A &rarr;</a></div>' +
        '<div class="field-grid" style="margin-top:16px">' +
          docFact("Effective Date", fmtDateTime(o.prelim.effectiveDate, o.prelim.effectiveTime) || "— set on Prelim Search") +
          docFact("Property Address", o.propertyAddress || "— set on Order Entry") +
          docFact("Legal Description", o.property.legalDescription ? (o.property.legalDescription + " However by showing this, no additional coverage is provided.") : "— set on Property") +
          docFact("Derivation", fullDerivationClause(o) || "— set on Prelim Search") +
          docFact("Vesting", derivationVestingClause(o.prelim.derivation, o.prelim.derivationPrincipals) || "— set on Prelim Search") +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-title">Schedule B-I &middot; Requirements</div>' +
        '<p class="field-hint" style="margin-top:0">Standard ALTA' + (c.formType === "Short Form" ? " Short Form" : "") + ' Requirements 1&ndash;' + biOffset + ' &mdash; always included, not editable/removable here (change Form Type on Schedule A if these need to differ):</p>' +
        biStandardRows +
        '<p class="field-hint" style="margin-top:12px">File-specific, continuing the numbering above:</p>' +
        (reqFileChips ? '<p class="field-hint" style="margin-top:0">From this file &mdash; Security Instruments &amp; Liens</p><div class="seed-picker">' + reqFileChips + '</div>' : '') +
        '<p class="field-hint" style="margin-top:0">Common language</p>' +
        '<div class="seed-picker">' + reqSeeds + '</div>' +
        reqRows +
        '<div class="add-form" style="grid-template-columns:1fr 1fr auto">' +
          '<div class="field"><label>Requirement</label><input type="text" id="req-description" placeholder="Custom requirement"></div>' +
          '<div class="field"><label>Notes</label><input type="text" id="req-notes" placeholder="Optional"></div>' +
          '<button class="btn btn-primary" id="btn-add-req">Add</button>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-title">Schedule B-II &middot; Exceptions</div>' +
        '<p class="field-hint" style="margin-top:0">Standard ALTA lead-in language and the &ldquo;gap&rdquo; exception always render on the generated document ahead of file-specific items (see below).</p>' +
        '<label style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--navy-ink);margin:8px 0"><input type="checkbox" id="c-includeGapException"' + (c.includeGapException ? ' checked' : '') + ' style="width:auto"> Include the standard &ldquo;gap&rdquo; Exception 1 (near-universal in practice, but bracketed/optional on the ALTA form)</label>' +
        (c.includeGapException ? '<p class="field-hint" style="margin-top:0">File-specific exceptions continue numbering from ' + (gapOffset+1) + ':</p>' : '<p class="field-hint" style="margin-top:0">Gap exception excluded &mdash; file-specific exceptions start at 1:</p>') +
        (emFileChips ? '<p class="field-hint" style="margin-top:0">From this file &mdash; Exception Matters</p><div class="seed-picker">' + emFileChips + '</div>' : '') +
        '<p class="field-hint" style="margin-top:0">Common language</p>' +
        '<div class="seed-picker">' + excSeeds + '</div>' +
        excRows +
        '<div class="add-form" style="grid-template-columns:1fr 1fr auto">' +
          '<div class="field"><label>Exception</label><input type="text" id="exc-description" placeholder="Custom exception"></div>' +
          '<div class="field"><label>Notes</label><input type="text" id="exc-notes" placeholder="Optional"></div>' +
          '<button class="btn btn-primary" id="btn-add-exc">Add</button>' +
        '</div>' +
      '</div>' +
      '<div class="generate-band">' +
        '<div><h3>Generate Commitment</h3><p>Assembles Schedule A, B-I, and B-II into a Commitment document from what’s on file.</p></div>' +
        '<button class="btn btn-primary" id="btn-generate" ' + (canGenerate ? "" : "disabled") + '>Generate Commitment</button>' +
      '</div>' +
      (canGenerate ? "" : '<p class="field-hint" style="margin-top:-14px;margin-bottom:20px">Needs Property Address, Legal Description, and Effective Date before it can generate.</p>') +
      doc;
  }

  /* ---------------- Contact selectors (Payor/Payee/Underwriter) ----------------
     Shared by Additional Title/Escrow Charges, Title Insurance Premiums, Endorsements, and
     Recording -- picks a name from Order Contacts instead of free-typing it, with an "Other"
     fallback for parties not yet added as a Contact. The choice resolves into a plain-text field
     (e.g. item.payor) so everything else that reads that field keeps working unchanged. */
  function contactPickerField(labelText, idPrefix, contacts, contactId, otherText, roleFilter){
    var pool = roleFilter ? contacts.filter(function(c){ return c.role === roleFilter; }) : contacts;
    if(roleFilter && pool.length === 0) pool = contacts; // never a dead-end if nobody's tagged that role yet
    var isOther = contactId === "__other__";
    var opts = '<option value="">— Select —</option>' +
      pool.map(function(c){ return '<option value="' + c.id + '"' + (c.id===contactId?" selected":"") + '>' + esc(c.name || "(unnamed)") + (c.role ? " — " + esc(c.role) : "") + '</option>'; }).join("") +
      '<option value="__other__"' + (isOther?" selected":"") + '>Other (type name)&hellip;</option>';
    var html = '<select id="' + idPrefix + '-contact">' + opts + '</select>' +
      (isOther ? '<input type="text" id="' + idPrefix + '-other" value="' + esc(otherText) + '" placeholder="Type name" style="margin-top:6px">' : '');
    return field(labelText, html);
  }
  // beforeChange (optional): called right before a contact-picker change is applied, e.g. so a
  // caller with other *unsaved* Save-button-gated fields in the same form (see Endorsements' edit
  // form) can commit them from the DOM into the data model first -- otherwise the renderTabPanel()
  // this triggers would regenerate that form's HTML from stale data and silently discard them.
  function bindContactPickerField(idPrefix, o, target, contactKey, otherKey, resolvedKey, beforeChange){
    var selEl = document.getElementById(idPrefix + "-contact");
    if(selEl) selEl.addEventListener("change", function(){
      if(beforeChange) beforeChange();
      target[contactKey] = selEl.value;
      if(selEl.value === "__other__"){
        target[resolvedKey] = target[otherKey] || "";
      } else {
        var c = (o.contacts||[]).filter(function(x){ return x.id === selEl.value; })[0];
        target[resolvedKey] = c ? c.name : "";
        target[otherKey] = "";
      }
      save(); renderTabPanel();
    });
    var otherEl = document.getElementById(idPrefix + "-other");
    if(otherEl) otherEl.addEventListener("change", function(){
      if(beforeChange) beforeChange();
      target[otherKey] = otherEl.value; target[resolvedKey] = otherEl.value; save(); renderTabPanel();
    });
  }

  /* ---------------- CD/HUD line assignment ----------------
     Lets a fee entered on a source screen (Additional Title/Escrow Charges, Title Insurance
     Premiums, Endorsements, Recording) be pushed onto the CDF's Section B/C/E/H and the matching
     HUD section as a real line item -- either the next available line or a chosen position --
     same source-dedup convention used for Requirements/Exceptions elsewhere (sourceType:sourceId):
     a fee can only be assigned once, and deleting the CDF/HUD line frees it up to reassign. HUD's
     Section 1100 (Title Charges) lumps Owner's + Lender's title-side fees together regardless of
     which CDF section (B/C/H) they're routed to, matching HUD-1's own convention; Section E
     (Taxes and Other Government Fees) maps to HUD's 1200 (Government Recording and Transfer
     Charges) instead. */
  var CD_TO_HUD_SECTION = { sectionB: "section1100", sectionC: "section1100", sectionH: "section1100", sectionE: "section1200" };
  function numberRange(n){ var arr = []; for(var i=1;i<=n;i++) arr.push(i); return arr; }
  // Deliberately the CDF section's own length, not the (possibly-shared, possibly-longer) HUD
  // array's length -- "Insert at line N" in the position dropdown built from this is a statement
  // about the CDF section on screen. See resolveHudIndex() in assignItemToCdHud() below for how
  // that CDF-relative N gets translated into a safe position within the shared HUD section1100
  // array without reordering rows other CDF sections already placed there.
  function cdSectionItemCount(o, cdSection){ return (o.escrow.cdf.page2[cdSection] || []).length; }
  function isAssignedToCdHud(o, sourceType, sourceId){
    if(!sourceType) return false;
    return CDF_PAGE2_SECTIONS.some(function(k){
      return (o.escrow.cdf.page2[k] || []).some(function(it){ return it.sourceType === sourceType && it.sourceId === sourceId; });
    });
  }
  function assignedCdSectionOf(o, sourceType, sourceId){
    var found = null;
    CDF_PAGE2_SECTIONS.forEach(function(k){
      if((o.escrow.cdf.page2[k]||[]).some(function(it){ return it.sourceType === sourceType && it.sourceId === sourceId; })) found = k;
    });
    return found;
  }
  // Maps a candidate's chosen Payor to the CDF/HUD column pair the amount should actually land
  // in, instead of always defaulting to Borrower At Closing / Borrower regardless of who's paying.
  // cand.payorContactId / cand.payorName come from the source item's own contact-picker fields
  // (see bindContactPickerField) -- "__other__" means a free-text payor with no Contact/role behind
  // it. Only "no payor chosen at all" (falsy payorContactId) keeps the historical Borrower default,
  // per the task's compatibility requirement for files that never touched Payor.
  function resolveCdHudPayorCols(o, cand, cdfCols){
    var BORROWER = { cdKey: "borrowerAtClosing", hudKey: "borrowerAmount" };
    if(!cand.payorContactId) return BORROWER; // no payor set -- unchanged legacy behavior
    var role = null;
    if(cand.payorContactId !== "__other__"){
      var c = (o.contacts || []).filter(function(x){ return x.id === cand.payorContactId; })[0];
      role = c ? c.role : null; // contact deleted/missing -> null role, falls through to third-party below
    }
    if(role === "Buyer/Borrower") return BORROWER;
    if(role === "Seller"){
      var hasSellerCol = cdfCols.some(function(c){ return c.key === "sellerAtClosing"; });
      // Refi's CDF_PAGE2_COLS_REFI drops the Seller-Paid columns entirely (no seller on a refi) --
      // writing "sellerAtClosing" there would set a key tplCdfLineItemTable/lineItemTotal never
      // look at, silently losing the money. Fall back to Paid by Others instead.
      return hasSellerCol ? { cdKey: "sellerAtClosing", hudKey: "sellerAmount" } : { cdKey: "paidByOthers", hudKey: null };
    }
    // Third party: Lender, Settlement Agent, Underwriter, any other/unrecognized role, or a
    // free-text "__other__" payor with no role at all. TRID's CD has a real "Paid by Others" column
    // for exactly this, excluded from the Borrower/Seller totals (cdfBorrowerClosingCostsTotal /
    // cdfSellerAtClosingCostsTotal only read the Borrower*/Seller* keys) -- so this doesn't overstate
    // either party's total. HUD_PAGE2_COLS has no third-party column at all (only Borrower/Seller);
    // decision: leave the HUD amount out of both rather than guess whose total should absorb money
    // neither the buyer nor the seller is actually paying -- hudKey: null makes buildItem() below
    // write "" to every HUD column for this line, same as it already does for every non-target column.
    return { cdKey: "paidByOthers", hudKey: null };
  }
  function assignItemToCdHud(o, cand, cdSection, posVal, sectionLabel){
    if(!cdSection || isAssignedToCdHud(o, cand.sourceType, cand.sourceId)) return;
    var cdfCols = cdfIsRefi(o) ? CDF_PAGE2_COLS_REFI : CDF_PAGE2_COLS_PURCHASE;
    var cdfTarget = o.escrow.cdf.page2[cdSection];
    var hudTarget = o.escrow.hud.page2[CD_TO_HUD_SECTION[cdSection]];
    var payorCols = resolveCdHudPayorCols(o, cand, cdfCols);
    function buildItem(cols, amountKey){
      var it = { id: uid(), description: cand.label, sourceType: cand.sourceType, sourceId: cand.sourceId };
      cols.forEach(function(c){ it[c.key] = (c.key === amountKey) ? cand.amount : ""; });
      return it;
    }
    // "Insert at line N" is a statement about the CDF section the user is looking at (posVal is
    // built from cdSectionItemCount(o, cdSection) above, i.e. that section's own array length) --
    // it is NOT a valid index into the HUD array. For sectionE->section1200 the two arrays always
    // have identical membership/order (nothing else feeds 1200), so reusing the same index there
    // is harmless. But section1100 is shared by B/C/H: it can be longer than any one CDF section's
    // own array, so blindly splicing HUD at the CDF-derived index silently reorders rows the user
    // never chose (see task write-up). Fix: resolve the CDF index to a real position first, then
    // derive the HUD's insertion point from where that section's *existing* neighbouring row
    // already sits in the HUD array -- never from the raw count -- so previously-assigned
    // section1100 rows can never change relative order.
    function resolveIndex(arr, pos){
      if(pos === "next" || !pos) return arr.length;
      var idx = parseInt(pos, 10) - 1;
      if(isNaN(idx) || idx < 0) idx = 0;
      if(idx > arr.length) idx = arr.length;
      return idx;
    }
    function hudPosOf(arr, sourceType, sourceId){
      for(var i=0;i<arr.length;i++){ if(arr[i].sourceType === sourceType && arr[i].sourceId === sourceId) return i; }
      return -1;
    }
    // cdIdx is resolved against cdfTarget's own (pre-insert) length/contents -- exactly what the
    // "Insert at line N" dropdown showed the user. hudIdx is then derived by locating that same
    // neighbouring CDF row's existing position inside hudTarget, so the HUD splice always lands
    // next to a row that's actually there rather than at a raw offset borrowed from another array.
    function resolveHudIndex(cdIdx){
      if(!hudTarget) return 0;
      if(cdIdx < cdfTarget.length){
        var beforeItem = cdfTarget[cdIdx];
        var beforePos = hudPosOf(hudTarget, beforeItem.sourceType, beforeItem.sourceId);
        if(beforePos !== -1) return beforePos;
      } else if(cdfTarget.length > 0){
        var afterItem = cdfTarget[cdfTarget.length - 1];
        var afterPos = hudPosOf(hudTarget, afterItem.sourceType, afterItem.sourceId);
        if(afterPos !== -1) return afterPos + 1;
      }
      // No neighbour found in the CDF section itself (it's currently empty, or -- defensively --
      // its item isn't mirrored in hudTarget yet): appending can never violate the "don't reorder
      // existing rows" invariant, so that's the only safe fallback.
      return hudTarget.length;
    }
    function insertAt(arr, item, idx){
      if(!arr) return;
      arr.splice(idx, 0, item);
    }
    var cdIdx = resolveIndex(cdfTarget, posVal);
    var hudIdx = resolveHudIndex(cdIdx);
    insertAt(cdfTarget, buildItem(cdfCols, payorCols.cdKey), cdIdx);
    insertAt(hudTarget, buildItem(HUD_PAGE2_COLS, payorCols.hudKey), hudIdx);
    logHistoryEvent(o, sectionLabel, "added", cand.label + " assigned to CD Section " + cdSection.replace("section","") + ": " + fmtMoney(cand.amount));
    save(); renderTabPanel();
  }
  // Looks back at the CDF line just assigned (or previously assigned) for sourceType/sourceId and
  // reports which column key actually holds the money, so the "✓ Assigned" hint below can name it
  // (Payor-routed assignments no longer all land in the same column -- see resolveCdHudPayorCols).
  function assignedCdColumnLabel(o, sourceType, sourceId, cdSection){
    if(!cdSection) return "";
    var cdfCols = cdfIsRefi(o) ? CDF_PAGE2_COLS_REFI : CDF_PAGE2_COLS_PURCHASE;
    var it = (o.escrow.cdf.page2[cdSection] || []).filter(function(x){ return x.sourceType === sourceType && x.sourceId === sourceId; })[0];
    if(!it) return "";

    return col ? col.label : "Paid by Others";
  }

  // is the list of CDF section keys the user may pick from (e.g. ["sectionB","sectionC"]); pass a
  // single-element array to fix the section (Owner's Policy -> Section H, Recording -> Section E)
  // and skip the dropdown.
  function cdAssignBlock(o, idPrefix, item, sourceType, sourceId, sectionChoices){
    if(!sourceId) return "";

      var foundSection = assignedCdSectionOf(o, sourceType, sourceId);
      var colLabel = assignedCdColumnLabel(o, sourceType, sourceId, foundSection);
      return '<p class="field-hint" style="margin-top:8px;color:var(--green)">&#10003; Assigned to CD Section ' + esc((foundSection||"").replace("section","")) + (colLabel ? ' (' + esc(colLabel) + ')' : '') + ' / HUD ' + esc((CD_TO_HUD_SECTION[foundSection]||"").replace("section","")) + '. Delete that line on the CD/HUD screen to reassign.</p>';
    }

      '</select>' : '';

    return '<div class="cd-assign-row" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px">' +
      sectionHtml +
      '<select id="' + idPrefix + '-cdpos">' + posOpts + '</select>' +
      '<button class="btn btn-secondary" data-cd-assign="' + idPrefix + '" style="font-size:11px;padding:6px 10px" data-cd-source="' + esc(sourceType) + ':' + esc(sourceId) + '">Assign to CD/HUD</button>' +
    '</div>';
  }

  }

  function renderDocBody(o, opts){
    opts = opts || {};
    var includeJacket = opts.includeJacket !== false;
    var c = o.commitment;
    var sa = c.scheduleA;
    var reqList = opts.filterDontShow ? c.requirements.filter(function(r){ return !r.dontShow; }) : c.requirements;
    var excList = opts.filterDontShow ? c.exceptions.filter(function(e){ return !e.dontShow; }) : c.exceptions;

    var biItems = standardBiItems(c.formType);
    var biOffset = includeJacket ? biItems.length : 0;
    var gapOffset = includeJacket && c.includeGapException ? 1 : 0;

    var biStandardItems = !includeJacket ? "" : biItems.map(function(t, idx){
      return '<div class="doc-item"><span class="doc-item-num">' + (idx+1) + '.</span>' + esc(t) + '</div>';
    }).join("");
    var gapExceptionItem = (!includeJacket || !c.includeGapException) ? "" :
      '<div class="doc-item"><span class="doc-item-num">1.</span>' + esc(ALTA_GAP_EXCEPTION_TEXT) + '</div>';

    var reqLabels = computeReqLabels(reqList, biOffset);
    var reqItems = reqList.map(function(r, idx){
      var indent = r.parentReqId ? 'margin-left:20px' : '';
      return '<div class="doc-item" style="' + indent + '"><span class="doc-item-num">' + reqLabels[idx] + '.</span>' + esc(r.description) +
        (r.notes ? '<div class="doc-item-note">' + esc(r.notes) + '</div>' : '') + '</div>';
    }).join("") || (biOffset ? "" : '<div class="doc-item" style="padding-left:0">None.</div>');

    var excItems = excList.map(function(e, idx){
      return '<div class="doc-item"><span class="doc-item-num">' + (idx+1+gapOffset) + '.</span>' + esc(e.description) +
        (e.notes ? '<div class="doc-item-note">' + esc(e.notes) + '</div>' : '') + '</div>';
    }).join("") || (gapOffset ? "" : '<div class="doc-item" style="padding-left:0">None.</div>');

    var cotItems = c.chainOfTitle.map(function(ci, idx){
      var parts = [
        ci.datedDate ? "Dated " + fmtDate(ci.datedDate) : "",
        ci.recordedDate ? "Recorded " + fmtDate(ci.recordedDate) : "",
        (ci.book || ci.page) ? ("Book " + esc(ci.book) + ", Page " + esc(ci.page)) : "",
        ci.instrumentNumber ? "Instrument No. " + esc(ci.instrumentNumber) : ""
      ].filter(Boolean).join(", ");
      return '<div class="doc-item"><span class="doc-item-num">' + (idx+1) + '.</span>' + esc(ci.instrumentType || "Instrument") +
        ' from ' + esc(ci.grantor || "?") + ' to ' + esc(ci.grantee || "?") +
        (parts ? '<div class="doc-item-note">' + parts + '</div>' : '') + '</div>';
    }).join("") || '<div class="doc-item" style="padding-left:0">None on file.</div>';

    var isShortFormDoc = c.formType === "Short Form";
    var title = opts.title || (isShortFormDoc ? "ALTA Short Form Commitment for an ALTA Short Form Residential Loan Policy" : "Commitment for Title Insurance");
    var caveat = opts.caveat || (c.final
      ? ('Finalized ' + fmtDate((c.finalizedAt||"").slice(0,10)) + ' &middot; FINAL &mdash; Requirements/Exceptions removed only via Curative disposition.')
      : ('Generated ' + fmtDate((c.generatedAt||"").slice(0,10)) + ' &middot; DRAFT &mdash; manual shell, not for issuance.'));

    var sigBlock = (sa.counterSignature || sa.counterSignatureDate) ?
      '<div class="doc-section">' +
        '<div class="doc-section-title">Countersigned</div>' +
        docLine("Authorized Signatory", sa.counterSignature) +
        docLine("Date", fmtDate(sa.counterSignatureDate)) +
      '</div>' : '';

    var jacketBlock = "";
    if(includeJacket){
      jacketBlock =
        '<div class="doc-section">' +
          '<div class="doc-section-title">Notice</div>' +
          ALTA_NOTICE_PARAGRAPHS.map(function(p){ return '<p class="doc-legal-p upper">' + esc(p) + '</p>'; }).join("") +
        '</div>' +
        '<div class="doc-section">' +
          '<div class="doc-section-title">Commitment to Issue Policy</div>' +
          commitmentToIssueHtml(o) +
        '</div>' +
        (isShortFormDoc ? "" :
        '<div class="doc-section">' +
          '<div class="doc-section-title">Commitment Conditions</div>' +
          commitmentConditionsHtml() +
        '</div>') +
        (c.issuingAgent || c.issuingOffice || c.altaUniversalId || c.loanIdNumber || c.commitmentNumber || c.revisionNumber ?
        '<div class="doc-section">' +
          '<div class="doc-section-title">Transaction Identification Data <span style="text-transform:none;font-weight:400;letter-spacing:normal">(for reference only)</span></div>' +
          docLine("Issuing Agent", c.issuingAgent) +
          docLine("Issuing Office", c.issuingOffice) +
          docLine("ALTA Universal ID", c.altaUniversalId) +
          docLine("Loan ID Number", c.loanIdNumber) +
          docLine("Commitment Number", c.commitmentNumber) +
          docLine("Issuing Office File Number", o.fileNo) +
          docLine("Property Address", o.propertyAddress) +
          (c.revisionNumber ? docLine("Revision Number", c.revisionNumber) : "") +
        '</div>' : '');
    }

    return '<div class="doc-head">' +
        '<div class="doc-brand">GENESIS &middot; M&amp;L TITLE AND ESCROW</div>' +
        '<div class="doc-title">' + esc(title) + '</div>' +
        '<div class="doc-file-no">FILE NO. ' + esc(o.fileNo) + '</div>' +
      '</div>' +
      jacketBlock +
      '<div class="doc-section">' +
        '<div class="doc-section-title">Schedule A</div>' +
        docLine("Commitment Date", fmtDateTime(sa.dateIssued, sa.timeIssued)) +
        docLine("Effective Date", fmtDateTime(o.prelim.effectiveDate, o.prelim.effectiveTime)) +
        docLine("Policy Type", o.policyType) +
        (o.policyType === "Owner's" || o.policyType === "Simultaneous" ?
          docLine("Owner's Policy — ALTA Form", sa.ownerPolicy.policyType) +
          docLine("Owner's Policy — Proposed Insured", sa.ownerPolicy.proposedInsured) +
          docLine("Owner's Policy — Coverage Amount", sa.ownerPolicy.coverageAmount ? fmtMoney(sa.ownerPolicy.coverageAmount) : "")
        : "") +
        (o.policyType === "Loan" || o.policyType === "Simultaneous" || isShortFormDoc ?
          docLine((isShortFormDoc ? "Short Form Policy" : "Loan Policy") + " — ALTA Form", sa.loanPolicy.policyType) +
          docLine((isShortFormDoc ? "Short Form Policy" : "Loan Policy") + " — Proposed Insured", sa.loanPolicy.proposedInsured) +
          (isShortFormDoc ? "" : docLine("Loan Policy — Mortgagee Clause", sa.loanPolicy.mortgageeClause)) +
          docLine((isShortFormDoc ? "Short Form Policy" : "Loan Policy") + " — Proposed Policy Amount", sa.loanPolicy.coverageAmount ? fmtMoney(sa.loanPolicy.coverageAmount) : "")
        : "") +
        docLine("Property Address", o.propertyAddress) +
        docLine("The estate or interest in the Land", isShortFormDoc ? "Fee Simple" : sa.titleHeldAs) +
        docLine("Legal Description", o.property.legalDescription ? (o.property.legalDescription + " However by showing this, no additional coverage is provided.") : "") +
        docLine("Derivation", fullDerivationClause(o)) +
        docLine("Vested In", derivationVestingClause(o.prelim.derivation, o.prelim.derivationPrincipals)) +
        (isShortFormDoc && sa.envProtectionLienStatutes ? docLine("ALTA 8.1-06 endorsement statutes", sa.envProtectionLienStatutes) : "") +
      '</div>' +
      '<div class="doc-section">' +
        '<div class="doc-section-title">Schedule A &middot; Chain of Title</div>' +
        cotItems +
      '</div>' +
      '<div class="doc-section">' +
        '<div class="doc-section-title">Schedule B-I &middot; Requirements</div>' +
        (includeJacket ? '<p class="doc-legal-p" style="margin-bottom:12px">All of the following Requirements must be met:</p>' + biStandardItems : "") +
        reqItems +
      '</div>' +
      '<div class="doc-section">' +
        '<div class="doc-section-title">Schedule B-II &middot; Exceptions</div>' +
        (includeJacket ? biiLeadInHtml(c.formType) : "") +
        gapExceptionItem +
        excItems +
      '</div>' +
      '<div class="doc-caveat">' + caveat + '</div>' +
      sigBlock;
  }

  function deedSummaryText(o){
    var d = o.docPrep.deed;
    var grantorClause = d.grantorName ? entityQualifiedName(d.grantorName, d.grantorEntityType, d.grantorPrincipals) : "";
    var granteeBase = d.granteeName ? entityQualifiedName(d.granteeName, d.granteeEntityType, d.granteePrincipals) : "";
    var granteeClause = granteeBase && o.vesting.buyerTenancy ? granteeBase + ", as " + o.vesting.buyerTenancy : granteeBase;
    if(!(d.instrumentType && grantorClause && granteeClause)) return "";
    return "This " + d.instrumentType + " conveys the Property from " + grantorClause + " to " + granteeClause +
      (d.consideration ? ", for the consideration of " + fmtMoney(d.consideration) : "") +
      (d.datedDate ? ", dated " + fmtDate(d.datedDate) : "") + ".";
  }

  function securityInstrumentSummaryText(o){
    var si = o.docPrep.securityInstrument;
    var mortgagorClause = si.mortgagorName ? entityQualifiedName(si.mortgagorName, si.mortgagorEntityType, si.mortgagorPrincipals) : "";

      (si.datedDate ? ", dated " + fmtDate(si.datedDate) : "") + ".";
  }

  /* ---------------- Payoff Calculations (2026-08-26) ----------------
     Principal Balance + per-diem interest (statement-provided, through the closing date) + Other
     Fees -> Net Payoff, then an explicit "Send to CD/HUD" push -- not a live auto-flow -- into
     CD Page 3 (purchase: the existing fixed Payoff of First/Second Mortgage fields for First/Second,
     a tagged line under N's Other Items for Other; refi: a tagged line in the Payoffs and Payments
     table) and the matching HUD Page 1 target (Reductions Due to Seller for purchase, Amounts Paid
     By/For Borrower for refi -- HUD has no fixed 1st/2nd fields, so it's always a tagged line).
     Re-sending after an edit updates the same tagged line by sourceType:sourceId rather than
     duplicating it (same dedup convention as the CD/HUD line-assignment chips elsewhere) -- except
     for the purchase First/Second fixed fields, which are a direct overwrite. Switching Position or
     Transaction Type *after* an initial send can leave a stale line at the old target; re-sending
     doesn't clean that up automatically, so double-check the old section if either changes. */
  var PAYOFF_POSITIONS = ["First", "Second", "Other"];
  function netPayoffAmount(p){
    var bal = parseFloat(p.principalBalance) || 0;
    var perDiem = parseFloat(p.perDiem) || 0;
    var days = parseFloat(p.days) || 0;
    var fees = parseFloat(p.otherFees) || 0;
    return bal + (perDiem * days) + fees;
  }
  // Suggests Days as Good Through Date -> CD Page 1's Closing Date (falling back to Order Entry's
  // Settlement Date) -- a suggestion via an explicit "Use N" button, not an auto-fill, since Days
  // must stay freely editable for a payoff good only through a different date than closing.
  function payoffSuggestedDays(o, p){
    if(!p.goodThroughDate) return null;
    var closing = o.escrow.cdf.page1.closingDate || o.settlementDate;
    if(!closing) return null;
    var gt = new Date(p.goodThroughDate + "T00:00:00");
    var cd = new Date(closing + "T00:00:00");
    if(isNaN(gt.getTime()) || isNaN(cd.getTime())) return null;
    var diff = Math.round((cd - gt) / 86400000);
    return diff >= 0 ? diff : null;
  }
  function upsertTaggedLineItem(arr, sourceType, sourceId, description, amount, amountKey){
    var existing = arr.filter(function(it){ return it.sourceType === sourceType && it.sourceId === sourceId; })[0];
    if(existing){
      existing.description = description;
      existing[amountKey] = amount;
    } else {
      var it = { id: uid(), description: description, sourceType: sourceType, sourceId: sourceId };
      it[amountKey] = amount;
      arr.push(it);
    }
  }
  function payoffCdHudTargetLabel(o, p){
    if(cdfIsRefi(o)) return "CD Page 3 Payoffs and Payments → HUD Amounts Paid By/For Borrower";
    if(p.position === "First") return "CD Page 3 Payoff of First Mortgage → HUD Reductions Due to Seller";
    if(p.position === "Second") return "CD Page 3 Payoff of Second Mortgage → HUD Reductions Due to Seller";
    return "CD Page 3 N. Due from Seller (Other Items) → HUD Reductions Due to Seller";
  }
  function sendPayoffToCdHud(o, p){
    var amt = netPayoffAmount(p);
    var refi = cdfIsRefi(o);
    var p3 = o.escrow.cdf.page3, hud1 = o.escrow.hud.page1;
    var label = p.label || (p.position + " Mortgage Payoff");
    if(refi){
      upsertTaggedLineItem(p3.payoffsAndPayments, "payoff", p.id, label, amt, "amount");
      upsertTaggedLineItem(hud1.amountsPaidByForBorrower, "payoff", p.id, label, amt, "amount");
    } else if(p.position === "First"){
      p3.fixed.firstMortgagePayoff = amt;
      upsertTaggedLineItem(hud1.reductionsDueToSeller, "payoff", p.id, label, amt, "amount");
    } else if(p.position === "Second"){
      p3.fixed.secondMortgagePayoff = amt;
      upsertTaggedLineItem(hud1.reductionsDueToSeller, "payoff", p.id, label, amt, "amount");
    } else {
      upsertTaggedLineItem(p3.dueFromSeller, "payoff", p.id, label, amt, "amount");
      upsertTaggedLineItem(hud1.reductionsDueToSeller, "payoff", p.id, label, amt, "amount");
    }
    p.sentToCdHud = true;
  }
  function tplPayoffRow(o, p){
    var amt = netPayoffAmount(p);
    var suggestedDays = payoffSuggestedDays(o, p);
    return '<div class="card" style="background:var(--paper);margin-top:12px">' +
      '<div class="field-grid cols-3">' +
        '<div class="field"><label>Label</label><input type="text" id="payoff-label-' + p.id + '" value="' + esc(p.label) + '" placeholder="e.g. First Mortgage — ABC Bank"></div>' +
        field("Position", selectField("payoff-position-" + p.id, PAYOFF_POSITIONS, p.position)) +
        '<div class="field"><label>Principal Balance</label><input type="text" id="payoff-principalBalance-' + p.id + '" value="' + esc(p.principalBalance) + '" placeholder="0.00"></div>' +
      '</div>' +
      '<div class="field-grid cols-3" style="margin-top:10px">' +
        '<div class="field"><label>Per Diem Interest</label><input type="text" id="payoff-perDiem-' + p.id + '" value="' + esc(p.perDiem) + '" placeholder="$/day"></div>' +
        '<div class="field"><label>Good Through Date</label><input type="date" id="payoff-goodThroughDate-' + p.id + '" value="' + esc(p.goodThroughDate) + '"></div>' +
        '<div class="field"><label>Days</label><input type="text" id="payoff-days-' + p.id + '" value="' + esc(p.days) + '" placeholder="0"></div>' +
      '</div>' +
      '<div class="field-grid cols-3" style="margin-top:10px">' +
        '<div class="field"><label>Other Fees</label><input type="text" id="payoff-otherFees-' + p.id + '" value="' + esc(p.otherFees) + '" placeholder="0.00"></div>' +
        docFact("Net Payoff", fmtMoney(amt)) +
      '</div>' +
      (suggestedDays !== null ? '<p class="field-hint" style="margin:8px 0 0">Good Through Date to Closing Date suggests <strong>' + suggestedDays + '</strong> day(s). <button class="btn btn-ghost" data-use-payoff-days="' + p.id + '" style="font-size:11px">Use ' + suggestedDays + '</button></p>' : '') +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px">' +
        (p.sentToCdHud ?
          '<p class="field-hint" style="margin:0;color:var(--green)">&#10003; Sent to CD/HUD (' + esc(payoffCdHudTargetLabel(o, p)) + ')</p>' +
          '<button class="btn btn-ghost" data-refill-payoff="' + p.id + '" style="font-size:11px">Refill CD/HUD</button>'
        :
          '<p class="field-hint" style="margin:0">Will send to: ' + esc(payoffCdHudTargetLabel(o, p)) + '</p>' +
          '<button class="btn btn-secondary" data-send-payoff="' + p.id + '" style="font-size:11px">Send to CD/HUD</button>'
        ) +
      '</div>' +

  }
  function tplEscrowPayoffs(o){
    var rows = o.escrow.payoffs.length === 0 ? '<div class="empty-card">No payoffs calculated yet.</div>' : o.escrow.payoffs.map(function(p){ return tplPayoffRow(o, p); }).join("");
    return '<p class="panel-intro">Compute a Net Payoff from a lender\'s payoff statement (Principal Balance + per-diem interest through the closing date + any Other Fees), then send it to CD Page 3 / HUD. First/Second post to CD\'s fixed Payoff of First/Second Mortgage fields (purchase mode) or the Payoffs and Payments table (refi mode); Other posts as a tagged line item. Re-sending after an edit updates the same CD/HUD line rather than duplicating it &mdash; but only for the target implied by the current Position/Transaction Type, so double-check the old section if either changes after an initial send.</p>' +
      rows +
      '<button class="btn btn-secondary" id="btn-add-payoff" style="margin-top:12px">Add Payoff</button>';
  }

  /* ---------------- Recording (2026-08-26) ----------------
     Recording fees, transfer taxes, and stamp taxes -- plain arithmetic from manually-entered
     rates/fees (same "Genesis doesn't compute rates" philosophy as Title Insurance Premiums), all
     of which report to CD Section E / HUD 1200 (Government Recording and Transfer Charges). */
  function computeRecordingDocAmount(r){
    var flat = parseFloat(r.feePerDoc), perPage = parseFloat(r.feePerPage), pages = parseFloat(r.pages);
    var total = (isNaN(flat)?0:flat) + (isNaN(perPage)||isNaN(pages)?0:perPage*pages);
    return total || "";
  }
  function computeRecordingTaxAmount(r){
    var basis = parseFloat(r.basisAmount), rate = parseFloat(r.rate);
    if(isNaN(basis) || isNaN(rate)) return "";
    return r.rateUnit === "perThousand" ? (basis / 1000) * rate : basis * (rate / 100);
  }
  function tplRecordingDocRow(o, r){
    var amt = computeRecordingDocAmount(r);
    return '<div class="card" style="background:var(--paper);margin-top:12px">' +
      '<div class="field-grid cols-3">' +
        '<div class="field"><label>Document</label><input type="text" id="rd-desc-' + r.id + '" value="' + esc(r.description) + '" placeholder="e.g. Deed, Deed of Trust"></div>' +
        '<div class="field"><label>Pages</label><input type="text" id="rd-pages-' + r.id + '" value="' + esc(r.pages) + '" placeholder="0"></div>' +
        '<div class="field"><label>Bill Code</label><input type="text" id="rd-billcode-' + r.id + '" value="' + esc(r.billCode) + '" placeholder="Optional"></div>' +
      '</div>' +
      '<div class="field-grid cols-3" style="margin-top:10px">' +
        '<div class="field"><label>Flat Fee (first page)</label><input type="text" id="rd-feePerDoc-' + r.id + '" value="' + esc(r.feePerDoc) + '" placeholder="0.00"></div>' +
        '<div class="field"><label>Fee Per Page</label><input type="text" id="rd-feePerPage-' + r.id + '" value="' + esc(r.feePerPage) + '" placeholder="0.00"></div>' +
        docFact("Computed Amount", amt ? fmtMoney(amt) : "—") +
      '</div>' +
      '<div class="field-grid cols-3" style="margin-top:10px">' +
        contactPickerField("Payor", "rd-payor-" + r.id, o.contacts, r.payorContactId, r.payorOther) +
        contactPickerField("Payee", "rd-payee-" + r.id, o.contacts, r.payeeContactId, r.payeeOther) +
        '<div class="field"><label>Notes</label><input type="text" id="rd-notes-' + r.id + '" value="' + esc(r.notes) + '" placeholder="Optional"></div>' +
      '</div>' +
      '<div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="icon-btn" data-del-recdoc="' + r.id + '" title="Remove">' + trashIcon() + '</button></div>' +
      cdAssignBlock(o, "rd-assign-" + r.id, r, "recdoc", amt ? r.id : "", ["sectionE"]) +
    '</div>';
  }
  function tplRecordingTaxRow(o, r, prefix, sourceType){
    var amt = computeRecordingTaxAmount(r);
    return '<div class="card" style="background:var(--paper);margin-top:12px">' +
      '<div class="field-grid cols-3">' +
        '<div class="field"><label>Description</label><input type="text" id="' + prefix + '-desc-' + r.id + '" value="' + esc(r.description) + '" placeholder="e.g. County Transfer Tax"></div>' +
        '<div class="field"><label>Basis Amount</label><input type="text" id="' + prefix + '-basisAmount-' + r.id + '" value="' + esc(r.basisAmount) + '" placeholder="e.g. Sale Price"></div>' +
        '<div class="field"><label>Bill Code</label><input type="text" id="' + prefix + '-billcode-' + r.id + '" value="' + esc(r.billCode) + '" placeholder="Optional"></div>' +
      '</div>' +
      '<div class="field-grid cols-3" style="margin-top:10px">' +
        '<div class="field"><label>Rate</label><input type="text" id="' + prefix + '-rate-' + r.id + '" value="' + esc(r.rate) + '" placeholder="e.g. 1"></div>' +
        field("Rate Unit", selectField(prefix + "-rateUnit-" + r.id, ["percent","perThousand"], r.rateUnit)) +
        docFact("Computed Amount", amt ? fmtMoney(amt) : "—") +
      '</div>' +
      '<div class="field-grid cols-3" style="margin-top:10px">' +
        contactPickerField("Payor", prefix + "-payor-" + r.id, o.contacts, r.payorContactId, r.payorOther) +
        contactPickerField("Payee", prefix + "-payee-" + r.id, o.contacts, r.payeeContactId, r.payeeOther) +
        '<div class="field"><label>Notes</label><input type="text" id="' + prefix + '-notes-' + r.id + '" value="' + esc(r.notes) + '" placeholder="Optional"></div>' +
      '</div>' +
      '<div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="icon-btn" data-del-' + prefix + '="' + r.id + '" title="Remove">' + trashIcon() + '</button></div>' +
      cdAssignBlock(o, prefix + "-assign-" + r.id, r, sourceType, amt ? r.id : "", ["sectionE"]) +
    '</div>';
  }
  function tplEscrowRecording(o){
    var rec = o.escrow.recording;
    var docRows = rec.documents.length === 0 ? '<div class="empty-card">No recorded documents yet.</div>' : rec.documents.map(function(r){ return tplRecordingDocRow(o, r); }).join("");
    var ttRows = rec.transferTaxes.length === 0 ? '<div class="empty-card">No transfer taxes yet.</div>' : rec.transferTaxes.map(function(r){ return tplRecordingTaxRow(o, r, "rtt", "transfertax"); }).join("");
    var stRows = rec.stampTaxes.length === 0 ? '<div class="empty-card">No stamp taxes yet.</div>' : rec.stampTaxes.map(function(r){ return tplRecordingTaxRow(o, r, "rst", "stamptax"); }).join("");
    var docTotal = rec.documents.reduce(function(s, r){ var n = parseFloat(computeRecordingDocAmount(r)); return s + (isNaN(n)?0:n); }, 0);
    var ttTotal = rec.transferTaxes.reduce(function(s, r){ var n = parseFloat(computeRecordingTaxAmount(r)); return s + (isNaN(n)?0:n); }, 0);
    var stTotal = rec.stampTaxes.reduce(function(s, r){ var n = parseFloat(computeRecordingTaxAmount(r)); return s + (isNaN(n)?0:n); }, 0);
    return '<p class="panel-intro">Recording fees, transfer taxes, and stamp taxes &mdash; plain arithmetic from rates/fees you enter (Genesis doesn\'t look up recorder or county rate schedules). Everything here reports to CD Section E / HUD 1200 (Government Recording and Transfer Charges).</p>' +
      '<div class="card">' +
        '<div class="card-title">Recording Fees</div>' +
        '<p class="field-hint" style="margin-top:0">One row per recorded document (Deed, Deed of Trust, releases, etc.) — flat fee plus an optional per-page rate.</p>' +
        docRows +
        '<button class="btn btn-secondary" id="btn-add-recdoc" style="margin-top:12px">Add Document</button>' +
        '<p class="field-hint" style="margin-top:10px;margin-bottom:0">Recording Fees Subtotal: <strong>' + fmtMoney(docTotal) + '</strong></p>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-title">Transfer Taxes</div>' +
        '<p class="field-hint" style="margin-top:0">Basis Amount &times; Rate (% or per $1,000) — e.g. Sale Price &times; County/State transfer tax rate.</p>' +
        ttRows +
        '<button class="btn btn-secondary" id="btn-add-rtt" style="margin-top:12px">Add Transfer Tax</button>' +
        '<p class="field-hint" style="margin-top:10px;margin-bottom:0">Transfer Taxes Subtotal: <strong>' + fmtMoney(ttTotal) + '</strong></p>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-title">Stamp Taxes</div>' +
        '<p class="field-hint" style="margin-top:0">Same calculation as Transfer Taxes — kept separate since some states (e.g. excise/documentary stamps) list them as their own line.</p>' +
        stRows +
        '<button class="btn btn-secondary" id="btn-add-rst" style="margin-top:12px">Add Stamp Tax</button>' +
        '<p class="field-hint" style="margin-top:10px;margin-bottom:0">Stamp Taxes Subtotal: <strong>' + fmtMoney(stTotal) + '</strong></p>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-title">Total Recording &amp; Transfer Charges</div>' +
        '<p style="font-size:20px;font-weight:600;color:var(--navy-ink);margin:8px 0 0">' + fmtMoney(docTotal + ttTotal + stTotal) + '</p>' +
      '</div>';
  }

  function tplEscrowCdf1(o){
    var p1 = o.escrow.cdf.page1;
    var totalClosingCosts = cdfBorrowerClosingCostsTotal(o);
    var cashToClose = cdfIsRefi(o) ? cdfCashToCloseRefiFinal(o) : cdfCashToCloseBorrower(o);
    return '<p class="panel-intro">Closing Disclosure &mdash; Page 1. Recreates the real CD\'s look (Cam\'s call) laid over Genesis\'s normal editable fields &mdash; not a pixel-exact copy of the PDF.</p>' +
      '<div class="cdform-header-block">' +
        '<div class="cdform-header-col">' +
          '<div class="cdform-header-col-title">Closing Information</div>' +
          cdMeta("Date Issued", '<input type="date" id="cdf1-dateIssued" value="' + esc(p1.dateIssued) + '">') +
          cdMeta("Closing Date", '<input type="date" id="cdf1-closingDate" value="' + esc(p1.closingDate) + '">') +
          cdMeta("Disbursement Date", '<input type="date" id="cdf1-disbursementDate" value="' + esc(p1.disbursementDate) + '">') +
        '</div>' +
        '<div class="cdform-header-col">' +
          '<div class="cdform-header-col-title">Transaction Information</div>' +
          cdMeta("Borrower(s)", '<input type="text" id="cdf1-borrowerNames" value="' + esc(p1.borrowerNames) + '">') +
          cdMeta("Seller(s)", '<input type="text" id="cdf1-sellerNames" value="' + esc(p1.sellerNames) + '">') +
          cdMeta("Lender", '<input type="text" id="cdf1-lenderName" value="' + esc(p1.lenderName) + '">') +

          '<button class="btn btn-ghost" id="btn-refill-cdf1-parties" style="margin-top:8px;font-size:11px">Refill from Contacts / Order Entry</button>' +
        '</div>' +
        '<div class="cdform-header-col">' +
          '<div class="cdform-header-col-title">Loan Information</div>' +
          cdMeta("Loan Term", '<input type="text" id="cdf1-loanTerm" value="' + esc(p1.loanTerm) + '" placeholder="e.g. 30 years">') +
          cdMeta("Purpose", selectField("cdf1-loanPurpose", LOAN_PURPOSE_TYPES, p1.loanPurpose)) +

          cdMeta("Loan ID #", '<input type="text" id="cdf1-loanIdNumber" value="' + esc(p1.loanIdNumber) + '">') +
          cdMeta("MIC #", '<input type="text" id="cdf1-micNumber" value="' + esc(p1.micNumber) + '">') +
        '</div>' +
      '</div>' +
      '<p class="field-hint" style="margin:-14px 0 20px">Borrower(s)/Seller(s)/Lender fill once from Contacts, Sale Price from Order Entry\'s Purchase Price, Loan Amount below from Order Entry\'s Loan Amount &mdash; independently editable afterward, Refill recomputes and overwrites. Purpose drives Refinance mode across all 5 CDF pages.</p>' +
      '<div class="cdform-wrap">' + cdBar("Loan Terms") + '<div class="cdform-table">' +
        cdMeta("Loan Amount", '<input type="text" id="cdf1-loanAmount" value="' + esc(p1.loanAmount) + '" placeholder="0.00">') +
        cdMeta("Interest Rate", '<input type="text" id="cdf1-interestRate" value="' + esc(p1.interestRate) + '" placeholder="%">') +
        cdMeta("Monthly Principal &amp; Interest", '<input type="text" id="cdf1-monthlyPI" value="' + esc(p1.monthlyPI) + '" placeholder="0.00">') +
        cdMeta("Prepayment Penalty?", selectField("cdf1-hasPrepaymentPenalty", YES_NO_OPTIONS, p1.hasPrepaymentPenalty)) +
        cdMeta("Balloon Payment?", selectField("cdf1-hasBalloonPayment", YES_NO_OPTIONS, p1.hasBalloonPayment)) +
      '</div></div>' +
      '<div class="cdform-wrap">' + cdBar("Projected Payments", p1.projectedPaymentsExtra.length ? "multiple periods" : "simplified") + '<div class="cdform-table">' +
        (p1.projectedPaymentsExtra.length ? cdMeta("Period 1 Label", '<input type="text" id="cdf1-pp1-label" value="' + esc(p1.projectedPaymentsPeriod1Label) + '" placeholder="e.g. Years 1-7">') : '') +
        cdMeta("Principal &amp; Interest", '<input type="text" id="cdf1-principalInterestAmount" value="' + esc(p1.principalInterestAmount) + '" placeholder="0.00">') +
        cdMeta("Mortgage Insurance", '<input type="text" id="cdf1-mortgageInsuranceAmount" value="' + esc(p1.mortgageInsuranceAmount) + '" placeholder="0.00">') +
        cdMeta("Estimated Escrow", '<input type="text" id="cdf1-estimatedEscrowAmount" value="' + esc(p1.estimatedEscrowAmount) + '" placeholder="0.00">') +
        cdMeta("Estimated Total Monthly Payment", '<input type="text" id="cdf1-estimatedTotalMonthlyPayment" value="' + esc(p1.estimatedTotalMonthlyPayment) + '" placeholder="0.00">') +
      '</div>' +
        p1.projectedPaymentsExtra.map(function(pp, idx){
          return '<div class="cdform-table" style="border-top:2px solid var(--line)">' +
            cdMeta("Period " + (idx+2) + " Label", '<input type="text" id="cdf1-ppx-label-' + pp.id + '" value="' + esc(pp.label) + '" placeholder="e.g. Years 8-30">') +
            cdMeta("Principal &amp; Interest", '<input type="text" id="cdf1-ppx-pi-' + pp.id + '" value="' + esc(pp.principalInterestAmount) + '" placeholder="0.00">') +
            cdMeta("Mortgage Insurance", '<input type="text" id="cdf1-ppx-mi-' + pp.id + '" value="' + esc(pp.mortgageInsuranceAmount) + '" placeholder="0.00">') +
            cdMeta("Estimated Escrow", '<input type="text" id="cdf1-ppx-esc-' + pp.id + '" value="' + esc(pp.estimatedEscrowAmount) + '" placeholder="0.00">') +
            cdMeta("Estimated Total Monthly Payment", '<input type="text" id="cdf1-ppx-total-' + pp.id + '" value="' + esc(pp.estimatedTotalMonthlyPayment) + '" placeholder="0.00">') +
            '<div style="display:flex;justify-content:flex-end;padding:8px 14px 12px"><button class="icon-btn" data-del-pp="' + pp.id + '" title="Remove period">' + trashIcon() + '</button></div>' +

        }).join('') +
        '<div style="padding:10px 14px"><button class="btn btn-secondary" id="btn-add-pp" style="font-size:12px">Add Payment Period</button></div>' +
        '<p class="cdform-note" style="padding:0 14px 10px">' + (p1.projectedPaymentsExtra.length ? "Exact projected amounts per period &mdash; the federal form’s min/max range display for adjustable payments isn’t modeled, just the value expected once each period starts." : "Single period shown. Use Add Payment Period for ARM/step loans whose payment changes at a later point (e.g. Years 1-7, then Years 8-30).") + '</p>' +
      '</div>' +
      '<div class="cdform-wrap">' + cdBar("Costs at Closing") + '<div class="cdform-table">' +
        cdMeta("Closing Costs", '<span class="cdform-amt-static">' + fmtMoney(totalClosingCosts) + '</span>') +
        cdMeta("Cash to Close" + (cdfIsRefi(o) ? "" : " (Borrower)"), '<span class="cdform-amt-static">' + fmtMoney(cashToClose) + '</span>') +
      '</div>' +
        '<p class="cdform-note" style="padding-bottom:10px">Both computed live from Page 2 (Closing Cost Details) and Page 3 (Calculating Cash to Close) &mdash; not editable here.</p>' +
      '</div>';
  }

  // Purchase: Borrower-Paid (At Closing / Before Closing) + Seller-Paid (At Closing / Before Closing)
  // + Paid by Others, matching the real CD's Closing Cost Details grid. Refi drops the two Seller-Paid
  // columns (no seller on a refi file) -- see cdfIsRefi().
  var CDF_PAGE2_COLS_PURCHASE = [
    {key:"borrowerAtClosing", label:"Borrower At Closing", group:"Borrower-Paid"},
    {key:"borrowerBeforeClosing", label:"Borrower Before Closing", group:"Borrower-Paid"},
    {key:"sellerAtClosing", label:"Seller At Closing", group:"Seller-Paid"},
    {key:"sellerBeforeClosing", label:"Seller Before Closing", group:"Seller-Paid"},
    {key:"paidByOthers", label:"Paid by Others", group:""}
  ];
  var CDF_PAGE2_COLS_REFI = [
    {key:"borrowerAtClosing", label:"Borrower At Closing", group:"Borrower-Paid"},
    {key:"borrowerBeforeClosing", label:"Borrower Before Closing", group:"Borrower-Paid"},
    {key:"paidByOthers", label:"Paid by Others", group:""}
  ];
  var CDF_PAGE2_SECTIONS = ["sectionA","sectionB","sectionC","sectionE","sectionF","sectionG","sectionH"];
  // Points (Section A), Prepaid Interest (Section F) and the Aggregate Adjustment (Section G) all
  // post into the Borrower-At-Closing bucket (Cam's simplifying call -- these are virtually always
  // borrower-paid-at-closing in practice); Lender Credits reduces the Borrower-At-Closing total the
  // same way the real form's Section J box nets Lender Credits against Closing Costs Subtotal
  // (D+I). Anything computed here therefore flows automatically into J wherever J is used downstream
  // (Page 1's Closing Costs meta, Page 3's Calculating Cash to Close, the refi Cash-to-Close formula).
  function cdfBorrowerClosingCostsTotal(o){
    var p2 = o.escrow.cdf.page2;
    var total = 0;
    CDF_PAGE2_SECTIONS.forEach(function(k){ total += lineItemTotal(p2[k], "borrowerAtClosing") + lineItemTotal(p2[k], "borrowerBeforeClosing"); });
    total += cdfPointsAmount(o) + cdfPrepaidInterestAmount(o) + cdfAggregateAdjustmentAmount(o);
    total -= (parseFloat(p2.lenderCredits) || 0);
    return total;
  }
  function cdfBorrowerAtClosingCostsTotal(o){
    var p2 = o.escrow.cdf.page2;
    var total = 0;
    CDF_PAGE2_SECTIONS.forEach(function(k){ total += lineItemTotal(p2[k], "borrowerAtClosing"); });
    total += cdfPointsAmount(o) + cdfPrepaidInterestAmount(o) + cdfAggregateAdjustmentAmount(o);
    total -= (parseFloat(p2.lenderCredits) || 0);
    return total;
  }
  function cdfBorrowerBeforeClosingCostsTotal(p2){
    var total = 0;
    CDF_PAGE2_SECTIONS.forEach(function(k){ total += lineItemTotal(p2[k], "borrowerBeforeClosing"); });
    return total;
  }
  function cdfSellerAtClosingCostsTotal(p2){
    // Seller's own closing-costs total (purchase mode only -- Page 2's Seller-Paid columns).
    // Only the At-Closing portion belongs on Page 3's N (Due from Seller) -- Before-Closing seller
    // costs were already paid and aren't due again at closing, same logic already used for the
    // refi Cash-to-Close formula.
    var total = 0;
    CDF_PAGE2_SECTIONS.forEach(function(k){ total += lineItemTotal(p2[k], "sellerAtClosing"); });
    return total;
  }
  function cdfLoanCostsSubtotal(o){
    var p2 = o.escrow.cdf.page2;
    return lineItemTotal(p2.sectionA, "borrowerAtClosing") + lineItemTotal(p2.sectionA, "borrowerBeforeClosing") +
      lineItemTotal(p2.sectionB, "borrowerAtClosing") + lineItemTotal(p2.sectionB, "borrowerBeforeClosing") +
      lineItemTotal(p2.sectionC, "borrowerAtClosing") + lineItemTotal(p2.sectionC, "borrowerBeforeClosing") +
      cdfPointsAmount(o);
  }
  function cdfOtherCostsSubtotal(o){
    var p2 = o.escrow.cdf.page2;
    var total = 0;
    ["sectionE","sectionF","sectionG","sectionH"].forEach(function(k){ total += lineItemTotal(p2[k], "borrowerAtClosing") + lineItemTotal(p2[k], "borrowerBeforeClosing"); });
    total += cdfPrepaidInterestAmount(o) + cdfAggregateAdjustmentAmount(o);
    return total;
  }
  function tplEscrowCdf2(o){
    var p2 = o.escrow.cdf.page2;
    var refi = cdfIsRefi(o);
    var cols = refi ? CDF_PAGE2_COLS_REFI : CDF_PAGE2_COLS_PURCHASE;
    function sectionBlock(key, label, chipsHtml){
      return '<div class="cdform-row section-label">' + esc(label) + '</div>' +
        (chipsHtml ? '<div class="seed-picker" style="padding:8px 12px 0">' + chipsHtml + '</div>' : '') +
        tplCdfLineItemTable(p2[key], cols, "cdf2" + key, "Subtotal");
    }
    // Points (A), Prepaid Interest (F) and the Aggregate Adjustment (G) are single fixed lines --
    // matching the cdFixedLine convention already used on Page 3's K/L/M/N -- rather than regular
    // free-text rows, since each needs its own small % / per-diem / negative-allowed calculator.
    var pointsAmt = cdfPointsAmount(o);
    var pointsLine = cdFixedLine("01", "% of Loan Amount (Points)",
      '<span style="display:flex;align-items:center;gap:6px;justify-content:flex-end">' +
        '<input type="text" id="cdf2-sectionA-pointsPercent" value="' + esc(p2.sectionAFixed.pointsPercent) + '" placeholder="0.000" style="width:64px;text-align:right">%' +
        '<span style="min-width:84px;text-align:right;font-weight:600">' + fmtMoney(pointsAmt) + '</span>' +
      '</span>');
    var prepaidAmt = cdfPrepaidInterestAmount(o);
    var prepaidLine = cdFixedLine("01", "Prepaid Interest",

  // Section G's escrow reserve rows compute Amount = Per Month x # Months (written into the item's

  // offered here since initial escrow reserves are, in practice, always borrower-paid-at-closing.
  function tplCdfEscrowTable(items, prefix){
    items = items || [];
    var colTemplate = "26px 2fr 100px 70px 100px 26px";
    var headerRow = '<div class="cdform-row header" style="display:grid;grid-template-columns:' + colTemplate + '">' +
      '<div></div><div>Description</div><div>Per Month</div><div># Months</div><div>Amount</div><div></div></div>';
    var rows = items.map(function(it, idx){
      var num = String(idx + 1); if(num.length < 2) num = "0" + num;
      return '<div class="cdform-row" style="display:grid;grid-template-columns:' + colTemplate + '">' +
        '<div class="cdform-num">' + num + '</div>' +
        '<div class="cdform-label"><input type="text" id="' + prefix + '-desc-' + it.id + '" value="' + esc(it.description) + '" placeholder="Description"></div>' +
        '<div class="cdform-amt"><input type="text" id="' + prefix + '-perMonth-' + it.id + '" value="' + esc(it.perMonth) + '" placeholder="0.00"></div>' +
        '<div class="cdform-amt"><input type="text" id="' + prefix + '-numMonths-' + it.id + '" value="' + esc(it.numMonths) + '" placeholder="0"></div>' +
        '<div class="cdform-amt-static">' + fmtMoney(parseFloat(it.borrowerAtClosing) || 0) + '</div>' +
        '<button class="icon-btn cdform-del" data-li-del="' + prefix + ':' + it.id + '" title="Remove">' + trashIcon() + '</button>' +
      '</div>';
    }).join("");
    var sum = items.reduce(function(s, it){ var n = parseFloat(it.borrowerAtClosing); return s + (isNaN(n) ? 0 : n); }, 0);
    var subtotalRow = '<div class="cdform-row subtotal" style="display:grid;grid-template-columns:' + colTemplate + '">' +
      '<div></div><div>Subtotal</div><div></div><div></div><div class="cdform-amt-static">' + fmtMoney(sum) + '</div><div></div></div>';
    var addRow = '<div class="cdform-row" style="display:grid;grid-template-columns:' + colTemplate + ';align-items:center">' +
      '<div></div><div><input type="text" id="' + prefix + '-new-desc" placeholder="Add a line item"></div>' +
      '<div><input type="text" id="' + prefix + '-new-perMonth" placeholder="0.00"></div>' +
      '<div><input type="text" id="' + prefix + '-new-numMonths" placeholder="0"></div><div></div>' +
      '<button class="btn btn-secondary" data-li-add="' + prefix + '" style="font-size:11px;padding:6px 8px">+</button>' +
    '</div>';
    return headerRow + rows + subtotalRow + addRow;
  }
  function wireCdfEscrowTable(items, prefix){
    items.forEach(function(it){
      var descEl = document.getElementById(prefix + "-desc-" + it.id);
      if(descEl) descEl.addEventListener("change", function(){ it.description = descEl.value; save(); renderTabPanel(); });
      var pmEl = document.getElementById(prefix + "-perMonth-" + it.id);
      var nmEl = document.getElementById(prefix + "-numMonths-" + it.id);
      function recompute(){
        it.perMonth = pmEl ? pmEl.value : it.perMonth;
        it.numMonths = nmEl ? nmEl.value : it.numMonths;
        var pm = parseFloat(it.perMonth) || 0, nm = parseFloat(it.numMonths) || 0;
        it.borrowerAtClosing = (pm * nm) || "";
        save(); renderTabPanel();
      }
      if(pmEl) pmEl.addEventListener("change", recompute);
      if(nmEl) nmEl.addEventListener("change", recompute);
    });
    var addBtn = document.querySelector('[data-li-add="' + prefix + '"]');
    if(addBtn) addBtn.addEventListener("click", function(){
      var descEl = document.getElementById(prefix + "-new-desc");
      var pmEl = document.getElementById(prefix + "-new-perMonth");
      var nmEl = document.getElementById(prefix + "-new-numMonths");
      var desc = descEl ? descEl.value.trim() : "";
      var pm = pmEl ? pmEl.value : "", nm = nmEl ? nmEl.value : "";
      if(!desc && !pm && !nm) return;
      var pmN = parseFloat(pm) || 0, nmN = parseFloat(nm) || 0;
      items.push({ id: uid(), description: desc, perMonth: pm, numMonths: nm, borrowerAtClosing: (pmN * nmN) || "", borrowerBeforeClosing: "", sellerAtClosing: "", sellerBeforeClosing: "", paidByOthers: "" });
      save(); renderTabPanel();
    });
    document.querySelectorAll('[data-li-del^="' + prefix + ':"]').forEach(function(el){
      el.addEventListener("click", function(){
        var val = el.getAttribute("data-li-del");
        var id = val.slice(prefix.length + 1);
        for(var k=0;k<items.length;k++){ if(items[k].id === id){ items.splice(k,1); break; } }
        save(); renderTabPanel();
      });
    });
  }

  function tplCurative(o){
    var c = o.commitment;
    if(!c.generated){
      return '<p class="panel-intro">Curative works the Requirements and Exceptions on a generated Commitment.</p>' +
        '<div class="empty-card">Generate a Commitment first, on the Commitment tab.</div>';
    }
    if(!c.final){
      return '<p class="panel-intro">Curative works Requirements and Exceptions once the Commitment is Final.</p>' +
        '<div class="empty-card">This Commitment is still Draft. Finalize it on the Commitment tab to start Curative &mdash; once Final, Requirements and Exceptions are removed only by dispositioning them here, not deleted outright.' +
        '<div style="margin-top:10px"><button class="btn btn-primary" id="btn-goto-commitment-from-curative">Go to Commitment</button></div>' +
        '</div>';
    }

    var totalReqCount = c.requirements.length;
    var openReqCount = c.requirements.filter(function(r){ return !r.disposition; }).length;
    var dispositionedReqCount = totalReqCount - openReqCount;
    var ctcReady = openReqCount === 0;

    var curBiOffset = standardBiItems(c.formType).length;
    var curGapOffset = c.includeGapException ? 1 : 0;
    var curReqLabels = computeReqLabels(c.requirements, curBiOffset);
    var reqRows = c.requirements.length === 0 ? '<div class="empty-card">No requirements on this Commitment.</div>' :
      c.requirements.map(function(r, idx){ return tplCurativeRow(r, curReqLabels[idx], REQUIREMENT_DISPOSITIONS, "req"); }).join("");

    var excRows = c.exceptions.length === 0 ? '<div class="empty-card">No exceptions on this Commitment.</div>' :
      c.exceptions.map(function(e, idx){ return tplCurativeRow(e, String(idx+1+curGapOffset), EXCEPTION_DISPOSITIONS, "exc"); }).join("");

    var ctcSection;
    if(c.ctcIssued){
      ctcSection = '<div class="generate-band">' +
        '<div><h3>Clear to Close &middot; Issued</h3><p>Issued ' + esc(fmtDate((c.ctcIssuedAt||"").slice(0,10))) + '. Rescind below if the underlying facts materially change &mdash; this reverts Title Status to Curative.</p></div>' +
      '</div>' + renderCtc(o);
    } else {
      ctcSection = '<div class="generate-band">' +
        '<div><h3>Issue Clear to Close</h3><p>' + dispositionedReqCount + ' of ' + totalReqCount + ' Requirements dispositioned. Exceptions are optional &mdash; most never get one.</p></div>' +
        '<button class="btn btn-primary" id="btn-issue-ctc" ' + (ctcReady ? "" : "disabled") + '>Issue Clear to Close</button>' +
      '</div>' +
      (ctcReady ? "" : '<p class="field-hint" style="margin-top:-14px;margin-bottom:20px">Every Requirement needs a Disposition before Clear to Close can issue.</p>');
    }

    return '<p class="panel-intro">Requirements essentially never get removed outright once Final &mdash; disposition them here instead. Most Exceptions are never dispositioned; that\'s expected.</p>' +
      '<div class="card">' +
        '<div class="card-title">Schedule B-I &middot; Requirements</div>' +
        reqRows +
      '</div>' +
      '<div class="card">' +
        '<div class="card-title">Schedule B-II &middot; Exceptions</div>' +
        '<p class="field-hint" style="margin-top:0">Optional &mdash; most Exceptions stay without a Disposition.</p>' +
        excRows +
      '</div>' +
      ctcSection;
  }

  function fmtHistoryTs(iso){
    if(!iso) return "";
    var d = new Date(iso);
    if(isNaN(d.getTime())) return iso;
    var datePart = d.toLocaleDateString("en-US", {year:"numeric", month:"short", day:"numeric"});
    var timePart = d.toLocaleTimeString("en-US", {hour:"numeric", minute:"2-digit"});
    return datePart + " at " + timePart;
  }

  function tplFileHistory(o){
    var list = (o.history || []).slice().reverse();
    var rows = list.length === 0 ? '<div class="empty-card">No history recorded yet.</div>' :
      list.map(function(h){
        var sectionBit = h.section ? esc(h.section) : "";
