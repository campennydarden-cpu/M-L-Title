  // Purchase: Borrower-Paid (At Closing / Before Closing) + Seller-Paid (At Closing / Before Closing)
  // + Paid by Others, matching the real CD's Closing Cost Details grid. Refi drops the two Seller-Paid
  // columns (no seller on a refi file) -- see cdfIsRefi().
  var CDF_PAGE2_COLS_PURCHASE = [
    {key:"borrowerAtClosing", label:"Borrower At Closing", group:"Borrower-Paid"},
    {key:"borrowerBeforeClosing", label:"Borrower Before Closing", group:"Borrower-Paid"},
    {key:"sellerAtClosing", label:"Seller At Closing", group:"Seller-Paid"},
    {key:"sellerBeforeClosing", label:"Seller Before Closing", group:"Seller-Paid"},
    {key:"paidByOthers", label:"Paid by Others", group:""}
  ];
  var CDF_PAGE2_COLS_REFI = [
    {key:"borrowerAtClosing", label:"Borrower At Closing", group:"Borrower-Paid"},
    {key:"borrowerBeforeClosing", label:"Borrower Before Closing", group:"Borrower-Paid"},
    {key:"paidByOthers", label:"Paid by Others", group:""}
  ];
  var CDF_PAGE2_SECTIONS = ["sectionA","sectionB","sectionC","sectionE","sectionF","sectionG","sectionH"];
  function cdfBorrowerClosingCostsTotal(p2){
    var total = 0;
    CDF_PAGE2_SECTIONS.forEach(function(k){ total += lineItemTotal(p2[k], "borrowerAtClosing") + lineItemTotal(p2[k], "borrowerBeforeClosing"); });
    return total;
  }
  function cdfBorrowerAtClosingCostsTotal(p2){
    var total = 0;
    CDF_PAGE2_SECTIONS.forEach(function(k){ total += lineItemTotal(p2[k], "borrowerAtClosing"); });
    return total;
  }
  function cdfBorrowerBeforeClosingCostsTotal(p2){
    var total = 0;
    CDF_PAGE2_SECTIONS.forEach(function(k){ total += lineItemTotal(p2[k], "borrowerBeforeClosing"); });
    return total;
  }
  function cdfLoanCostsSubtotal(p2){
    return lineItemTotal(p2.sectionA, "borrowerAtClosing") + lineItemTotal(p2.sectionA, "borrowerBeforeClosing") +
      lineItemTotal(p2.sectionB, "borrowerAtClosing") + lineItemTotal(p2.sectionB, "borrowerBeforeClosing") +
      lineItemTotal(p2.sectionC, "borrowerAtClosing") + lineItemTotal(p2.sectionC, "borrowerBeforeClosing");
  }
  function cdfOtherCostsSubtotal(p2){
    var total = 0;
    ["sectionE","sectionF","sectionG","sectionH"].forEach(function(k){ total += lineItemTotal(p2[k], "borrowerAtClosing") + lineItemTotal(p2[k], "borrowerBeforeClosing"); });
    return total;
  }
  function tplEscrowCdf2(o){
    var p2 = o.escrow.cdf.page2;
    var refi = cdfIsRefi(o);
    var cols = refi ? CDF_PAGE2_COLS_REFI : CDF_PAGE2_COLS_PURCHASE;
    function sectionBlock(key, label){
      return '<div class="cdform-row section-label">' + esc(label) + '</div>' + tplCdfLineItemTable(p2[key], cols, "cdf2" + key, "Subtotal");
    }
    var loanCosts = sectionBlock("sectionA", "A. Origination Charges") + sectionBlock("sectionB", "B. Services Borrower Did Not Shop For") + sectionBlock("sectionC", "C. Services Borrower Did Shop For");
    var otherCosts = sectionBlock("sectionE", "E. Taxes and Other Government Fees") + sectionBlock("sectionF", "F. Prepaids") + sectionBlock("sectionG", "G. Initial Escrow Payment at Closing") + sectionBlock("sectionH", "H. Other");
    var d = cdfLoanCostsSubtotal(p2), i = cdfOtherCostsSubtotal(p2), j = cdfBorrowerClosingCostsTotal(p2);
    return '<p class="panel-intro">Closing Disclosure &mdash; Page 2 (Closing Cost Details).' + (refi ? ' Refinance mode: Seller-Paid columns dropped (no seller on this file).' : '') + '</p>' +
      '<div class="cdform-wrap">' + cdBar("Loan Costs") + '<div class="cdform-table">' + loanCosts +
        '<div class="cdform-row total" style="grid-template-columns:1fr auto"><div>D. Total Loan Costs (Borrower-Paid)</div><div class="cdform-amt-static">' + fmtMoney(d) + '</div></div>' +
      '</div></div>' +
      '<div class="cdform-wrap">' + cdBar("Other Costs") + '<div class="cdform-table">' + otherCosts +
        '<div class="cdform-row total" style="grid-template-columns:1fr auto"><div>I. Total Other Costs (Borrower-Paid)</div><div class="cdform-amt-static">' + fmtMoney(i) + '</div></div>' +
      '</div></div>' +
      '<div class="cdform-wrap">' + cdBar("Total Closing Costs (J)") + '<div class="cdform-table">' +
        '<div class="cdform-row total" style="grid-template-columns:1fr auto"><div>J. Total Closing Costs (Borrower-Paid) = D + I</div><div class="cdform-amt-static">' + fmtMoney(j) + '</div></div>' +
      '</div></div>';
  }

  var CDF_PAGE3_COLS = [{key:"amount", label:"Amount"}];

        cdCalcRow("Total Closing Costs (J)", cdCalcInput("cdf3calc-totalClosingCostsLE", calc.totalClosingCostsLE), cdCalcStatic(cdfBorrowerClosingCostsTotal(p2))) +

    '</div>';
    var summaries;
    if(refi){
      summaries = '<div class="cdform-wrap">' + cdBar("Payoffs and Payments", "summary of your payoffs and payments to others from your loan amount") +

        '<div class="cdform-row section-label">L. Paid Already by or on Behalf of Borrower</div>' + tplCdfLineItemTable(p3.paidByOrForBorrower, CDF_PAGE3_COLS, "cdf3l", "Total (L)") +
        '<div class="cdform-row total" style="grid-template-columns:1fr auto"><div>Cash to/from Borrower (K &minus; L)</div><div class="cdform-amt-static">' + fmtMoney(cdfCashToCloseBorrower(o)) + '</div></div>';
      var sellerCol = '<div class="cdform-row section-label">M. Due to Seller at Closing</div>' + tplCdfLineItemTable(p3.dueToSeller, CDF_PAGE3_COLS, "cdf3m", "Total (M)") +
        '<div class="cdform-row section-label">N. Due from Seller at Closing</div>' + tplCdfLineItemTable(p3.dueFromSeller, CDF_PAGE3_COLS, "cdf3n", "Total (N)") +
        '<div class="cdform-row total" style="grid-template-columns:1fr auto"><div>Cash to/from Seller (M &minus; N)</div><div class="cdform-amt-static">' + fmtMoney(cdfCashToCloseSeller(o)) + '</div></div>';

  function tplCurative(o){
    var c = o.commitment;
    if(!c.generated){
      return '<p class="panel-intro">Curative works the Requirements and Exceptions on a generated Commitment.</p>' +
        '<div class="empty-card">Generate a Commitment first, on the Commitment tab.</div>';
    }
    if(!c.final){
      return '<p class="panel-intro">Curative works Requirements and Exceptions once the Commitment is Final.</p>' +
        '<div class="empty-card">This Commitment is still Draft. Finalize it on the Commitment tab to start Curative &mdash; once Final, Requirements and Exceptions are removed only by dispositioning them here, not deleted outright.' +
        '<div style="margin-top:10px"><button class="btn btn-primary" id="btn-goto-commitment-from-curative">Go to Commitment</button></div>' +
        '</div>';
    }

    var totalReqCount = c.requirements.length;
    var openReqCount = c.requirements.filter(function(r){ return !r.disposition; }).length;
    var dispositionedReqCount = totalReqCount - openReqCount;
    var ctcReady = openReqCount === 0;

    var curBiOffset = standardBiItems(c.formType).length;
    var curGapOffset = c.includeGapException ? 1 : 0;
    var curReqLabels = computeReqLabels(c.requirements, curBiOffset);
    var reqRows = c.requirements.length === 0 ? '<div class="empty-card">No requirements on this Commitment.</div>' :
      c.requirements.map(function(r, idx){ return tplCurativeRow(r, curReqLabels[idx], REQUIREMENT_DISPOSITIONS, "req"); }).join("");

    var excRows = c.exceptions.length === 0 ? '<div class="empty-card">No exceptions on this Commitment.</div>' :
      c.exceptions.map(function(e, idx){ return tplCurativeRow(e, String(idx+1+curGapOffset), EXCEPTION_DISPOSITIONS, "exc"); }).join("");

    var ctcSection;
    if(c.ctcIssued){
      ctcSection = '<div class="generate-band">' +
        '<div><h3>Clear to Close &middot; Issued</h3><p>Issued ' + esc(fmtDate((c.ctcIssuedAt||"").slice(0,10))) + '. Rescind below if the underlying facts materially change &mdash; this reverts Title Status to Curative.</p></div>' +
      '</div>' + renderCtc(o);
    } else {
      ctcSection = '<div class="generate-band">' +
        '<div><h3>Issue Clear to Close</h3><p>' + dispositionedReqCount + ' of ' + totalReqCount + ' Requirements dispositioned. Exceptions are optional &mdash; most never get one.</p></div>' +
        '<button class="btn btn-primary" id="btn-issue-ctc" ' + (ctcReady ? "" : "disabled") + '>Issue Clear to Close</button>' +
      '</div>' +
      (ctcReady ? "" : '<p class="field-hint" style="margin-top:-14px;margin-bottom:20px">Every Requirement needs a Disposition before Clear to Close can issue.</p>');
    }

    return '<p class="panel-intro">Requirements essentially never get removed outright once Final &mdash; disposition them here instead. Most Exceptions are never dispositioned; that\'s expected.</p>' +
      '<div class="card">' +
        '<div class="card-title">Schedule B-I &middot; Requirements</div>' +
        reqRows +
      '</div>' +
      '<div class="card">' +
        '<div class="card-title">Schedule B-II &middot; Exceptions</div>' +
        '<p class="field-hint" style="margin-top:0">Optional &mdash; most Exceptions stay without a Disposition.</p>' +
        excRows +
      '</div>' +
      ctcSection;
  }

  /* ---------------- Reusable line-item table (Escrow/Closing: CDF & HUD itemized sections) ----------------
     One generic pattern reused across every "list of {description + one or more dollar columns} with a
     computed total" section on CDF Pages 2/3 and HUD Pages 1/2 -- rather than hand-rolling ~15 near-identical
     CRUD lists. Each row is directly editable (no separate add/edit-toggle state); "Add" appends a new row. */
  function tplLineItemTable(items, cols, prefix){
    items = items || [];
    var colTemplate = "2fr " + cols.map(function(){ return "1fr"; }).join(" ") + " auto";
    var headerRow = items.length ? ('<div style="display:grid;grid-template-columns:' + colTemplate + ';gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--slate);padding-bottom:4px">' +
      '<div>Description</div>' + cols.map(function(c){ return '<div>' + esc(c.label) + '</div>'; }).join("") + '<div></div></div>') : "";
    var rows = items.map(function(it){
      return '<div style="display:grid;grid-template-columns:' + colTemplate + ';gap:8px;align-items:center;padding:4px 0">' +
        '<input type="text" id="' + prefix + '-desc-' + it.id + '" value="' + esc(it.description) + '" placeholder="Description">' +
        cols.map(function(c){ return '<input type="text" id="' + prefix + '-' + c.key + '-' + it.id + '" value="' + esc(it[c.key]) + '" placeholder="0.00">'; }).join("") +
        '<button class="icon-btn" data-li-del="' + prefix + ':' + it.id + '" title="Remove">' + trashIcon() + '</button>' +
      '</div>';
    }).join("");
    var totalRow = items.length ? ('<div style="display:grid;grid-template-columns:' + colTemplate + ';gap:8px;padding:6px 0;border-top:1px solid var(--hairline);margin-top:2px">' +
      '<div style="font-weight:600;font-size:12.5px">Total</div>' +
      cols.map(function(c){
        var sum = items.reduce(function(s, it){ var n = parseFloat(it[c.key]); return s + (isNaN(n) ? 0 : n); }, 0);
        return '<div style="font-weight:600;font-size:12.5px">' + fmtMoney(sum) + '</div>';
      }).join("") + '<div></div></div>') : "";
    var emptyState = items.length ? "" : '<div class="empty-card">No line items yet.</div>';
    var addRow = '<div style="display:grid;grid-template-columns:' + colTemplate + ';gap:8px;align-items:center;margin-top:8px">' +
      '<input type="text" id="' + prefix + '-new-desc" placeholder="Add a line item">' +
      cols.map(function(c){ return '<input type="text" id="' + prefix + '-new-' + c.key + '" placeholder="0.00">'; }).join("") +
      '<button class="btn btn-secondary" data-li-add="' + prefix + '">Add</button>' +
    '</div>';
    return headerRow + rows + totalRow + emptyState + addRow;

  function wireLineItemTable(items, prefix, cols){
    items.forEach(function(it){
      var descEl = document.getElementById(prefix + "-desc-" + it.id);
      if(descEl) descEl.addEventListener("change", function(){ it.description = descEl.value; save(); renderTabPanel(); });
      cols.forEach(function(c){
        var el = document.getElementById(prefix + "-" + c.key + "-" + it.id);
        if(!el) return;
        el.addEventListener("change", function(){ it[c.key] = el.value; save(); renderTabPanel(); });
      });
    });
    var addBtn = document.querySelector('[data-li-add="' + prefix + '"]');
    if(addBtn) addBtn.addEventListener("click", function(){
      var descEl = document.getElementById(prefix + "-new-desc");
      var desc = descEl ? descEl.value.trim() : "";
      var newItem = { id: uid(), description: desc };
      var anyVal = false;
      cols.forEach(function(c){
        var el = document.getElementById(prefix + "-new-" + c.key);
        var v = el ? el.value : "";
        if(v) anyVal = true;
        newItem[c.key] = v;
      });
      if(!desc && !anyVal) return;
      items.push(newItem);
      save(); renderTabPanel();
    });
    document.querySelectorAll('[data-li-del^="' + prefix + ':"]').forEach(function(el){
      el.addEventListener("click", function(){
        var val = el.getAttribute("data-li-del");
        var id = val.slice(prefix.length + 1);
        for(var i=0;i<items.length;i++){ if(items[i].id === id){ items.splice(i,1); break; } }
        save(); renderTabPanel();
      });
    });
  }

    var headerRow = '<div class="cdform-row header" style="display:grid;grid-template-columns:' + colTemplate + '">' + headerCells.join("") + '</div>';
    var rows = items.map(function(it, idx){

  /* ---------------- Proration split calculator (Escrow/Closing: Tax & Other Prorations) ----------------
     Standard 365-day, per-diem method. Convention used here: Seller is responsible for the proration
     period through the day BEFORE the proration date; Buyer is credited/charged from the proration date
     forward (i.e. Buyer owns the day of closing). This is a common convention but not universal -- some
     states/local customs credit the day of closing to the Seller instead. Flagged to Cam; not configurable
     yet. */
  function computeProrationSplit(annualAmount, periodStart, periodEnd, prorationDate){
    var amt = parseFloat(annualAmount);
    if(isNaN(amt) || !periodStart || !periodEnd || !prorationDate) return null;
    var start = new Date(periodStart + "T00:00:00");
    var end = new Date(periodEnd + "T00:00:00");
    var settle = new Date(prorationDate + "T00:00:00");
    if(isNaN(start.getTime()) || isNaN(end.getTime()) || isNaN(settle.getTime())) return null;
    var totalDays = Math.round((end - start) / 86400000) + 1;
    if(totalDays <= 0) return null;
    var sellerDays = Math.round((settle - start) / 86400000);
    if(sellerDays < 0) sellerDays = 0;
    if(sellerDays > totalDays) sellerDays = totalDays;
    var buyerDays = totalDays - sellerDays;
    var dailyRate = amt / totalDays;
    return {
      totalDays: totalDays, sellerDays: sellerDays, buyerDays: buyerDays,
      sellerAmount: dailyRate * sellerDays, buyerAmount: dailyRate * buyerDays
    };
  }
  function tplProrationRow(items, prefix, typeOptions){
    var rows = (items||[]).length === 0 ? '<div class="empty-card">None added yet.</div>' :
      items.map(function(p){
        var split = computeProrationSplit(p.annualAmount, p.periodStart, p.periodEnd, p.prorationDate);
        var splitText = split ? (split.sellerDays + " days Seller / " + split.buyerDays + " days Buyer &mdash; Seller " + esc(fmtMoney(split.sellerAmount)) + ", Buyer " + esc(fmtMoney(split.buyerAmount))) : "Fill in period + proration date to calculate the split";
        var typeField = typeOptions ?
          '<select id="' + prefix + '-type-' + p.id + '">' + typeOptions.map(function(t){ return '<option value="' + t + '"' + (t===p.type?" selected":"") + '>' + t + '</option>'; }).join("") + '</select>' :
          '<input type="text" id="' + prefix + '-desc-' + p.id + '" value="' + esc(p.description) + '" placeholder="Description">';
        return '<div class="card" style="background:var(--paper)">' +
          '<div class="field-grid cols-4">' +
            '<div class="field"><label>' + (typeOptions ? "Type" : "Description") + '</label>' + typeField + '</div>' +
            '<div class="field"><label>Annual Amount</label><input type="text" id="' + prefix + '-amt-' + p.id + '" value="' + esc(p.annualAmount) + '" placeholder="0.00"></div>' +
            '<div class="field"><label>Period Start</label><input type="date" id="' + prefix + '-start-' + p.id + '" value="' + esc(p.periodStart) + '"></div>' +
            '<div class="field"><label>Period End</label><input type="date" id="' + prefix + '-end-' + p.id + '" value="' + esc(p.periodEnd) + '"></div>' +
            '<div class="field"><label>Proration Date</label><input type="date" id="' + prefix + '-prdate-' + p.id + '" value="' + esc(p.prorationDate) + '"></div>' +
          '</div>' +
          '<p class="field-hint" style="margin-top:8px;margin-bottom:0">' + splitText + '</p>' +
          '<button class="icon-btn" data-del-proration="' + prefix + ':' + p.id + '" title="Remove" style="margin-top:6px">' + trashIcon() + '</button>' +

          contact.poaEnabled = !!d.poaEnabled;
          contact.poaAttorneyInFactName = d.poaAttorneyInFactName;
          contact.poaInstrumentRef = d.poaInstrumentRef;
          contact.ssn = d.ssn || "";
          contact.dob = d.dob || "";
        } else if(d.entityType === "LLC" || d.entityType === "Corporation" || d.entityType === "Partnership"){
          contact.stateOfOrg = d.stateOfOrg;
          if(d.entityType === "Partnership") contact.partnershipType = d.partnershipType;
          contact.principals = state.formPrincipals;
        } else if(d.entityType === "Trust"){
          contact.principals = state.formPrincipals;
        } else if(d.entityType === "Estate"){
          contact.repTitle = d.repTitle;
          contact.decedentName = d.decedentName;
          contact.probateCaseNumber = d.probateCaseNumber;
          contact.probateCounty = d.probateCounty;
        }
      } else {
        contact.entityType = undefined;
        contact.address = d.address || "";
        contact.currentAddress = ""; contact.mailingAddress = ""; contact.forwardingAddress = "";
        contact.ssn = ""; contact.dob = "";
        contact.licenseNumber = ""; contact.altaId = ""; contact.mortgageeClause = "";
        if(d.role === "Title Company" || d.role === "Settlement Agent"){
          contact.licenseNumber = d.licenseNumber || "";
          contact.altaId = d.altaId || "";
        } else if(d.role === "Lender"){
          contact.mortgageeClause = d.mortgageeClause || "";
        }
      }
      if(isVestingRole(d.role)){
        // If the signature line section was never touched (brand-new contact, saved without opening
        // it), seed one default line now from the just-finalized contact record -- same non-destructive
        // fill-if-blank spirit as elsewhere, just deferred to save time since there's nothing to compute
        // a default from until the contact's own fields are set.
        contact.signatureLines = state.formSignatureLines.length ? state.formSignatureLines : [{ id: uid(), text: signatureLineForContact(contact) }];

        contact.signatureLines = [];
      }
      if(isNew) o.contacts.push(contact);

    bindText("cdf5-refinance", function(v){ o.escrow.cdf.page5.refinance = v; });
    bindText("cdf5-taxDeductions", function(v){ o.escrow.cdf.page5.taxDeductions = v; });
    ["lender","mortgageBroker","realEstateBrokerBuyer","realEstateBrokerSeller","settlementAgent"].forEach(function(key){
      ["name","license","contact","address","email","phone"].forEach(function(f){
        bindText("cdf5-" + key + "-" + f, function(v){ o.escrow.cdf.page5.contacts[key][f] = v; });
      });
    });
    var btnRefillCdf5Contacts = document.getElementById("btn-refill-cdf5-contacts");
    if(btnRefillCdf5Contacts) btnRefillCdf5Contacts.addEventListener("click", function(){
      var p5c = o.escrow.cdf.page5.contacts;
      var lender = o.contacts.filter(function(c){ return c.role === "Lender"; })[0];
      if(lender){ p5c.lender.name = lender.name || ""; p5c.lender.address = lender.address || ""; p5c.lender.email = lender.email || ""; p5c.lender.phone = lender.phone || ""; }
      var sa = o.contacts.filter(function(c){ return c.role === "Settlement Agent"; })[0];
      if(sa){ p5c.settlementAgent.name = sa.name || ""; p5c.settlementAgent.address = sa.address || ""; p5c.settlementAgent.email = sa.email || ""; p5c.settlementAgent.phone = sa.phone || ""; p5c.settlementAgent.license = sa.licenseNumber || ""; }
      logHistoryEvent(o, "Escrow / Closing", "milestone", "CDF Page 5 Lender / Settlement Agent contacts refilled from Contacts");
      save(); renderTabPanel();
    });

    // Express HUD Page 1
    bindText("hud1-typeOfLoan", function(v){ o.escrow.hud.page1.typeOfLoan = v; });
    bindText("hud1-loanNumber", function(v){ o.escrow.hud.page1.loanNumber = v; });
    bindText("hud1-micNumber", function(v){ o.escrow.hud.page1.micNumber = v; });
    bindText("hud1-placeOfSettlement", function(v){ o.escrow.hud.page1.placeOfSettlement = v; });
    wireLineItemTable(o.escrow.hud.page1.grossDueFromBorrower, "hud1gfb", HUD_PAGE1_COLS);
    wireLineItemTable(o.escrow.hud.page1.amountsPaidByForBorrower, "hud1pfb", HUD_PAGE1_COLS);
    wireLineItemTable(o.escrow.hud.page1.grossDueToSeller, "hud1gts", HUD_PAGE1_COLS);
    wireLineItemTable(o.escrow.hud.page1.reductionsDueToSeller, "hud1rds", HUD_PAGE1_COLS);

    // Express HUD Page 2
    ["section700","section800","section900","section1000","section1100","section1200","section1300"].forEach(function(k){
      wireLineItemTable(o.escrow.hud.page2[k], "hud2" + k, HUD_PAGE2_COLS);
    });

    // Express HUD Page 3
    bindText("hud3-initialLoanAmount", function(v){ o.escrow.hud.page3.initialLoanAmount = v; });
    bindText("hud3-loanTerm", function(v){ o.escrow.hud.page3.loanTerm = v; });
    bindText("hud3-initialInterestRate", function(v){ o.escrow.hud.page3.initialInterestRate = v; });
    bindText("hud3-initialMonthlyAmount", function(v){ o.escrow.hud.page3.initialMonthlyAmount = v; });
    bindText("hud3-doesRateAdjust", function(v){ o.escrow.hud.page3.doesRateAdjust = v; });
    bindText("hud3-hasPrepaymentPenalty", function(v){ o.escrow.hud.page3.hasPrepaymentPenalty = v; });
    bindText("hud3-hasBalloonPayment", function(v){ o.escrow.hud.page3.hasBalloonPayment = v; });
    ["gfeCannotIncrease","gfeTenPercentCap","gfeCanChange"].forEach(function(key){
      bindText("hud3-" + key + "-gfeAmount", function(v){ o.escrow.hud.page3[key].gfeAmount = v; });
      bindText("hud3-" + key + "-hud1Amount", function(v){ o.escrow.hud.page3[key].hud1Amount = v; });
    });

    function bindText(id, setter){
      var el = document.getElementById(id);
      if(!el) return;
      var section = ALL_TAB_LABELS[state.currentTab] || state.currentTab;
      var fieldEl = el.closest ? el.closest(".field") : null;
      var labelEl = fieldEl ? fieldEl.querySelector("label") : null;
      var fieldLabel = labelEl ? labelEl.textContent : id;
      var beforeVal = el.value;
      el.addEventListener("input", function(){ setter(el.value); save(); });
      el.addEventListener("change", function(){
        setter(el.value);
        logHistory(o, section, fieldLabel, beforeVal, el.value);
        beforeVal = el.value;
        save();
      });
    }
  }

  load();
  render();
})();
</script>
